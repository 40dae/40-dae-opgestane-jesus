        `Wat tref jou aan die verandering in perspektief van die mense wat in Jesaja 53 oor die Dienaar praat?`,
        `Hoe verander die besef dat Christus ons skuld gedra het die manier waarop jy na sy kruis kyk?`
    ],
    prayer: `Here Jesus, wanneer ek na u lyding kyk, help my om ook my eie behoefte aan genade raak te sien. Dankie dat U ons skuld gedra het en dat u opstanding verklaar dat die dood nie die einde was nie. Amen.`,
    available: true
  },
  {
    day: 28,
    title: `Die Gesalfde wat goeie nuus bring`,
    theme: `God se Gesalfde kondig ’n tyd van herstel, vryheid en genade aan`,
    reading: `Jesaja 61:1-11`,
    verse: `“Die Here het my gesalf om ’n blye boodskap te bring aan die mense in nood.”`,
    verseRef: `Jesaja 61:1 • 1983-vertaling`,
    paragraphs: [
        `Jesaja 61 begin met iemand op wie die Gees van God gekom het. Hy is “gesalf”, dieselfde grondgedagte wat ons reeds by die woorde Messias en Christus teëgekom het. Sy sending word dadelik beskryf aan die hand van die mense na wie hy gestuur word: mense in nood, moedeloosheid en gevangenskap.`,
        `Later in die gedeelte verander die beelde. Mense wat getreur het, ontvang weer vreugde. Eeue-oue puinhope word opgebou en verlate plekke word herstel. Die goeie nuus waarvan Jesaja praat, raak dus mense wie se lewens en gemeenskappe lank die merke van verlies gedra het.`,
        `Hierdie gedeelte kry ’n besondere plek in Jesus se bediening. Lukas vertel dat Jesus in die sinagoge van Nasaret uit Jesaja lees. Hy kies juis hierdie woorde oor die Gees, goeie nuus en vrylating. Daarna verklaar Hy dat die Skrifwoord wat die mense gehoor het, daardie dag vervul is.`,
        `Daar is ’n klein detail in Lukas se weergawe wat besonder interessant is. Jesus eindig sy aanhaling by die aankondiging van die Here se genadetyd. Jesaja se volgende woorde praat ook van God se dag van vergelding. Jesus se openbare bediening begin dus in Lukas met die sterk klem op goeie nuus, vrylating en die genade wat in sy koms naby gekom het.`,
        `Ons sien daardie program vervolgens in sy lewe ontvou. Mense wat deur ander aan die kant geskuif is, word raakgesien. Siekes kom na Hom toe. Sondaars ontdek dat daar ’n weg terug is. Jesus se aankondiging van God se koninkryk kry konkrete vorm in die soort mense wat deur sy teenwoordigheid nuwe hoop ontvang.`,
        `Jesaja 61 beweeg egter verder as individuele herstel. Die mense wat herstel word, begin self herbou. Ou puinhope kry weer vorm en plekke wat geslagte lank verlate was, word herstel. God se genade maak mense dus ook deel van sy herstellende werk.`,
        `Dit is ’n gepaste gedeelte om ná die opstanding te lees. Die dissipels gaan binnekort uitgestuur word met goeie nuus wat hulle self ontvang het. Hulle taak begin by wat God gedoen het en beweeg daarna na ’n wêreld wat daarvan moet hoor.`,
        `Ons staan steeds binne daardie beweging. Mense wat deur Christus se genade bereik is, word mense deur wie sy goeie nuus verder kan gaan.`
    ],
    questions: [
        `Watter aspek van Jesus se sending in Jesaja 61 help jou om sy bediening beter te verstaan?`,
        `Waar kan jy deel word van God se herstellende werk in die lewe van iemand rondom jou?`
    ],
    prayer: `Here Jesus, dankie vir die goeie nuus van u genade. Help my om u herstel in my eie lewe te ontvang en maak my beskikbaar om hoop, troos en vryheid na ander mense toe te dra. Amen.`,
    available: true
  },
  {
    day: 29,
    title: `Die regverdige Spruit`,
    theme: `Wanneer Israel se herders faal, belowe God weer ’n koning uit Dawid se huis`,
    reading: `Jeremia 23:1-8`,
    verse: `“Ek sal vir Dawid ’n regverdige spruit laat opskiet, ’n koning wat verstandig sal regeer.”`,
    verseRef: `Jeremia 23:5 • 1983-vertaling`,
    paragraphs: [
        `Jeremia 23 begin met ’n aanklag teen Israel se herders. In die Ou Testament kon konings en ander leiers as herders van die volk beskryf word. Hulle taak was om te beskerm en reg te laat geskied. Volgens Jeremia het hierdie herders die teenoorgestelde gedoen: die kudde is verstrooi en mense het verlore geraak.`,
        `Dit is teen hierdie agtergrond dat die belofte van die “regverdige spruit” gehoor moet word. Die probleem is swak koningskap, en God antwoord met die belofte van ’n koning wat anders sal regeer.`,
        `Die beeld van ’n spruit herinner aan Jesaja 11, wat ons enkele dae gelede gelees het. Daar het ’n loot uit die stomp van Isai gegroei. Jeremia gebruik ’n verwante beeld en verbind dit weer uitdruklik met Dawid. Selfs wanneer die koningshuis ernstig beskadig lyk, is God se belofte aan Dawid nog deel van Israel se hoop.`,
        `Wat hierdie toekomstige koning onderskei, is sy regverdige regering. Jeremia leef in ’n tyd waarin korrupte en onverstandige leierskap geweldige gevolge vir gewone mense gehad het. Die belofte van ’n regverdige koning was daarom nie ’n abstrakte godsdienstige gedagte nie. Dit het gegaan oor veiligheid, reg en die soort lewe wat onder goeie regering moontlik word.`,
        `Jeremia voeg ’n besonder betekenisvolle naam by hierdie belofte. Die koning se naam word verbind met die Here se regverdige regering oor sy volk. Die mense wat deur ontroue herders verstrooi is, sal weer versamel word en veilig woon.`,
        `Wanneer Jesus later “Seun van Dawid” genoem word, dra daardie titel hierdie geskiedenis saam. Dit sê veel meer as iets oor sy familie-afkoms. Dit plaas Hom binne Israel se langdurige verwagting dat God ’n ware koning uit Dawid se lyn sou gee.`,
        `Die opstanding verander die dissipels se begrip van hierdie koningskap ingrypend. Die Koning wat hulle aan die kruis sien sterf het, staan lewend voor hulle. Sy heerskappy word nie deur sy dood beëindig nie. Binnekort sal hulle Hom as Here verkondig ver buite die grense van Juda.`,
        `Jeremia se belofte herinner ons dat mense se mislukking God se trou nie uitput nie. Slegte herders kan groot skade aanrig, maar hulle kry nie die finale woord oor God se volk nie. Die verhaal bly beweeg na die Koning wat regverdig regeer.`
    ],
    questions: [
        `Waarom is dit belangrik dat Jeremia se belofte van die Spruit juis ná sy kritiek op Israel se herders kom?`,
        `Hoe behoort Jesus se regverdige koningskap die manier waarop jy self met ander mense omgaan te beïnvloed?`
    ],
    prayer: `Here Jesus, U is die Koning wat regverdig regeer. Help my om u heerskappy te vertrou en vorm in my dieselfde liefde vir waarheid, reg en die welstand van mense wat aan my sorg toevertrou word. Amen.`,
    available: true
  },
  {
    day: 30,
    title: `God self kom as Herder`,
    theme: `Esegiël belowe dat God sy verstrooide kudde self sal soek en aan een Herder sal toevertrou`,
    reading: `Esegiël 34:20-31`,
    verse: `“Ek gaan vir hulle net een herder aanstel, en hy sal vir hulle sorg: my dienaar Dawid.”`,
    verseRef: `Esegiël 34:23 • 1983-vertaling`,
    paragraphs: [
        `Esegiël 34 begin met een van die skerpste aanklagte teen leierskap in die Ou Testament. Israel se herders het hulleself gevoed terwyl die kudde verwaarloos is. Die swakkes is nie versorg nie en dié wat weggedwaal het, is nie teruggebring nie. Die gevolg is ’n verstrooide kudde sonder iemand wat werklik na hulle omsien.`,
        `Dan maak God ’n buitengewone verklaring: Hy sal self na sy skape gaan soek.`,
        `Die beeld is persoonlik. God beskryf Homself as die Herder wat tussen die verstrooide skape ingaan, hulle versamel en terugbring. Die mense wat deur hulle leiers verwaarloos is, word nie bloot aan ’n nuwe administratiewe stelsel oorgegee nie. God sê dat Hy self vir hulle sal sorg.`,
        `Wanneer ons by ons Skrifgedeelte vanaf vers 20 kom, verskyn nog ’n element. God gaan ook tussen die skape self oordeel, omdat sterkes die swakkes verdring het. Daarna belowe Hy “een herder”, sy dienaar Dawid.`,
        `Hier ontstaan ’n interessante spanning. God sê dat Hy self die Herder sal wees, en tog belowe Hy ’n Dawidiese Herder wat oor die kudde sal regeer. Vir ’n Christelike leser word hierdie twee lyne besonder betekenisvol wanneer ons by Jesus kom.`,
        `Jesus staan binne Dawid se koninklike lyn en noem Homself in Johannes 10 die goeie herder. Sy bediening weerspieël ook Esegiël se beeld. Hy soek mense op wat verlore geraak het en gee besondere aandag aan dié wat ander maklik miskyk. Die goeie Herder se sorg bereik uiteindelik sy diepste punt wanneer Jesus sê dat Hy sy lewe vir die skape aflê.`,
        `Ná die kruis gebeur egter iets wat die beeld nog verder verdiep. Die Herder wat sy lewe gegee het, staan weer lewend tussen sy volgelinge. Die kudde wat ná sy arrestasie verstrooi geraak het, word weer deur Hom bymekaargebring.`,
        `Esegiël eindig met vrede en veiligheid. Die skape kan leef sonder voortdurende vrees omdat hulle aan God behoort en onder sy sorg staan. Dit beteken nie dat die wêreld skielik sonder gevaar is nie. Die diepste veiligheid van die kudde lê in die identiteit van hulle Herder.`,
        `Die hoofstuk vra daarom ook hoe ons oor Jesus se koningskap dink. Hy regeer soos ’n Herder. Sy gesag word sigbaar in die manier waarop Hy sorg, soek en beskerm.`
    ],
    questions: [
        `Wat leer Esegiël 34 jou oor die soort leierskap wat God van ’n herder verwag?`,
        `Waar in jou lewe het jy vandag nodig om Christus se sorg as jou Herder te vertrou?`
    ],
    prayer: `Here Jesus, goeie Herder, dankie dat U u skape ken en versorg. Bring my terug wanneer ek afdwaal, leer my om u stem te vertrou en vorm in my dieselfde sorg vir mense wat kwesbaar of vergete is. Amen.`,
    available: true
  },
  {
    day: 31,
    title: `Die Seun van die Mens`,
    theme: `Daniël sien ’n menslike heerser wie se koninkryk die gewelddadige ryke van die wêreld oorleef`,
    reading: `Daniël 7:9-14`,
    verse: `“Aan dié menslike wese is die heerskappy en eer en koningskap gegee.”`,
    verseRef: `Daniël 7:14 • 1983-vertaling`,
    paragraphs: [
        `Daniël 7 begin met ’n onstuimige see waaruit vreemde diere verskyn. Een lyk soos ’n leeu, ’n ander soos ’n beer, en later verskyn ’n dier wat Daniël besonder vreesaanjaend vind. Die visioen self verduidelik dat hierdie diere koninkryke voorstel. Menslike mag word dus uitgebeeld as iets wat al hoe meer dierlik en vernietigend kan word.`,
        `Dan verander die toneel. Daniël sien die hemelse hof en Hom wat ewig lewe op sy troon. Die geraas van aardse ryke word skielik vanuit ’n ander perspektief gesien. Hulle mag is indrukwekkend, maar dit is tydelik en staan onder God se oordeel.`,
        `In hierdie toneel kom daar met die wolke “iemand soos ’n menslike wese”. Die kontras met die diere is opvallend. Ná die opeenvolging van dieragtige ryke verskyn iemand wat werklik menslik lyk. Aan hom word heerskappy gegee wat al die volke en taalgroepe insluit en wat nooit tot niet sal gaan nie.`,
        `Hierdie beeld help ons om een van Jesus se bekendste benamings vir Homself beter te verstaan. In die Evangelies noem Hy Homself telkens “die Seun van die Mens”. Vir iemand wat Daniël geken het, kon daardie titel veel meer oproep as bloot die gedagte dat Jesus ’n mens was. Dit kon herinner aan die figuur wat voor God verskyn en ’n ewige koningskap ontvang.`,
        `Die verbinding word besonder duidelik tydens Jesus se verhoor. Wanneer Hy oor sy toekomstige verhoging praat, gebruik Hy die taal van Daniël 7. Kort daarna word Hy deur aardse maghebbers veroordeel en gekruisig. Vanuit menslike perspektief lyk dit asof die ryke van hierdie wêreld gewen het.`,
        `Opstandingsondag verander daardie perspektief. Die veroordeelde Jesus leef, en sy dissipels begin verkondig dat Hy Here is. Daniël se visioen help hulle om te verstaan dat die gesag van Christus veel verder strek as die mag van enige regering of ryk.`,
        `Die visioen gee daarom hoop sonder om die werklikheid van onderdrukking te ontken. Daniël het self geskrik oor wat hy gesien het. Tog sien hy ook dat gewelddadige mag nie vir altyd regeer nie. Uiteindelik behoort die koninkryk aan God en aan die Een aan wie Hy dit gee.`
    ],
    questions: [
        `Wat leer die kontras tussen die dieragtige ryke en die menslike wese jou oor die verskil tussen menslike mag en Christus se heerskappy?`,
        `Hoe beïnvloed dit jou perspektief wanneer jy onthou dat geen aardse mag die laaste woord het nie?`
    ],
    prayer: `Here Jesus, U het ’n koninkryk ontvang wat nie tot niet gaan nie. Help my om u heerskappy te vertrou wanneer aardse mag indrukwekkend of bedreigend lyk, en leer my om getrou onder u gesag te leef. Amen.`,
    available: true
  },
  {
    day: 32,
    title: `Die Herder-Koning uit Betlehem`,
    theme: `Uit ’n klein dorpie kom ’n heerser wat God se volk soos ’n herder sal lei`,
    reading: `Miga 5:1-5`,
    verse: `“Maar jy, Betlehem-Efrata, jy is klein onder die families in Juda, maar uit jou sal daar iemand kom wat aan My behoort.”`,
    verseRef: `Miga 5:1 • 1983-vertaling`,
    paragraphs: [
        `Betlehem was reeds lank voor Miga se tyd aan ’n koning verbind. Dit was die dorp van Isai en die plek waar Samuel die jong Dawid tussen sy pa se seuns laat roep het. Dawid was toe nog die een wat skape opgepas het. Uit hierdie onopvallende begin het Israel se bekendste koningshuis gegroei.`,
        `Eeue later praat Miga weer oor Betlehem. Teen hierdie tyd verkeer Juda onder groot druk en die bedreiging van vyandige magte hang oor die land. Tog plaas die profeet sy hoop op ’n toekomstige regeerder wat juis uit die klein Betlehem-Efrata sal kom.`,
        `Die beskrywing van hierdie heerser is interessant. Hy sal sy volk lei deur die krag wat die Here hom gee. Die beeld herinner aan ’n herder wat by sy kudde staan en vir hulle sorg. Sy betekenis strek verder as plaaslike veiligheid, want Miga sê dat sy grootheid tot by die uithoeke van die aarde sal reik.`,
        `Wanneer wyse manne later in Jerusalem vra waar die koning van die Jode gebore sou word, haal die skrifgeleerdes hierdie gedeelte uit Miga aan. Die naam Betlehem word daarmee deel van die geboorteverhaal van Jesus. Tog bied Miga meer as net ’n geografiese leidraad oor waar die Messias gebore sou word. Die gedeelte vertel ook iets oor die soort heerser waarna Israel verlang het.`,
        `Hy kom uit ’n klein plek. Hy ontvang sy krag van God en lei sy mense soos ’n herder. Miga vat sy betekenis uiteindelik saam met die eenvoudige woorde: “Hy sal vrede bring.”`,
        `Dit gee besondere diepte aan Jesus se verhaal. Die Kind van Betlehem word later die Man wat Homself as die goeie Herder beskryf. Hy versamel mense rondom Hom en gee uiteindelik sy lewe vir sy skape. Ná sy opstanding vind ons Hom weer waar Hy sy verstrooide volgelinge opsoek en hulle roeping herstel.`,
        `Die Bybel verbind groot dinge dikwels met plekke wat maklik gering geag word. Betlehem herinner ons dat die grootte van ’n plek of die aansien daarvan weinig sê oor wat God daar kan begin. Die klein dorpie word deel van ’n verhaal waarvan die omvang uiteindelik die nasies bereik.`
    ],
    questions: [
        `Wat voeg die herderbeeld in Miga 5 by jou begrip van Jesus as Koning?`,
        `Waar is jy geneig om iets as te klein of onbelangrik te beskou om deur God gebruik te word?`
    ],
    prayer: `Here Jesus, Herder en Koning, dankie dat u sorg tot by gewone mense en klein plekke kom. Leer my om u leiding te vertrou en om nie gering te ag wat U kan gebruik in u groter werk nie. Amen.`,
    available: true
  },
  {
    day: 33,
    title: `Vuil klere word verwyder`,
    theme: `Sagaria sien hoe skuld voor God weggeneem word en ’n aangeklaagde priester nuwe klere ontvang`,
    reading: `Sagaria 3:1-10`,
    verse: `“Ek het jou jou oortredings vergewe en Ek gaan vir jou skoon klere aantrek.”`,
    verseRef: `Sagaria 3:4 • 1983-vertaling`,
    paragraphs: [
        `Sagaria se vierde visioen lyk amper soos ’n hofsaak. Die hoëpriester Jesua staan voor die engel van die Here, terwyl die Satan langs hom staan om hom aan te kla. Jesua se toestand help sy saak glad nie. Sy priesterklere is liederlik vuil.`,
        `Vir ’n hoëpriester is dié beeld besonder ernstig. Sy klere behoort met sy heilige diens verbind te wees, maar hier word sy onreinheid openlik sigbaar. Die aanklag teen hom kan dus nie bloot weggewuif word asof daar niks verkeerd is nie.`,
        `Dan gebeur iets wat Jesua nie self kan bewerk nie. God bestraf die aanklaer en gee die bevel dat Jesua se vuil klere uitgetrek moet word. Die verklaring wat daarop volg, verduidelik die simboliek: sy oortredings is vergewe. Skoon klere word vir hom aangetrek en ’n skoon tulband word op sy kop geplaas.`,
        `Vergifnis word hier amper tasbaar. Iets wat Jesua dra en wat almal kan sien, word van hom afgehaal. Daarna staan dieselfde man voor God, maar sy voorkoms vertel nou ’n ander verhaal. Die verandering begin by God se uitspraak oor hom.`,
        `Die tyd waarin Sagaria optree, maak die visioen nog ryker. Die volk het uit ballingskap teruggekeer en Jerusalem moes weer opgebou word. Jesua word selfs beskryf as iemand soos ’n stuk hout wat uit die vuur gered is. Die volk het oordeel beleef, en tog was hulle verhaal nie verby nie.`,
        `Teen die einde van die visioen verskyn ook die belofte van God se dienaar, die “Loot”, en die Here verklaar dat Hy die sonde van die land op een dag sal wegneem. Die visioen beweeg dus vanaf een vuilgeklede priester na ’n groter hoop op reiniging wat God self sal bewerk.`,
        `Vir Christelike lesers vind hierdie hoop besondere vervulling in Christus. Die Nuwe Testament praat oor vergifnis as iets wat God gee op grond van Jesus se werk. Ons staan nie voor Hom omdat ons daarin geslaag het om ons eie klere skoon genoeg te maak nie. Ons ontvang genade omdat God ons skuld wegneem.`,
        `Sagaria gee vir daardie waarheid ’n beeld wat moeilik vergeet word. Die aanklag word gehoor, die vuilheid is werklik, en tog eindig die toneel met skoon klere.`
    ],
    questions: [
        `Wat leer die verandering van Jesua se klere jou oor die manier waarop Sagaria vergifnis uitbeeld?`,
        `Is daar skuld wat jy steeds soos vuil klere probeer saamdra nadat jy dit reeds voor God gebring het?`
    ],
    prayer: `Genadige God, dankie dat U skuld wegneem en nuwe lewe moontlik maak. Help my om u vergifnis werklik te ontvang en om met dankbaarheid te leef uit die genade wat U in Christus gee. Amen.`,
    available: true
  },
  {
    day: 34,
    title: `Die gekroonde Priester en die Loot`,
    theme: `’n Ongewone kroning word ’n teken van God se toekomstige Koning en sy herstelde tempel`,
    reading: `Sagaria 6:9-15`,
    verse: `“Dit is hy wat die tempel van die Here sal bou, dit is hy wat die mag sal besit.”`,
    verseRef: `Sagaria 6:13 • 1983-vertaling`,
    paragraphs: [
        `Ná ’n reeks vreemde visioene ontvang Sagaria ’n baie konkrete opdrag. Ballinge het uit Babel aangekom met silwer en goud. Sagaria moet daarvan ’n kroon maak en dit op die kop van Jesua, die hoëpriester, plaas.`,
        `Dit is ’n verrassende handeling. Jesua is ’n priester, terwyl die kroon ons onmiddellik aan koningskap laat dink. In Israel se gewone orde het die priesterskap en die Dawidiese koningskap verskillende rolle en familielyne gehad. Juis daarom trek hierdie simboliese kroning die aandag.`,
        `Sagaria moet tydens die kroning praat oor iemand met die naam “Loot”. Ons het hierdie plantbeeld reeds in Jesaja en Jeremia teëgekom. ’n Loot begin klein, maar dra die moontlikheid van nuwe groei. Hier word die Loot verbind met die bou van die tempel, heerskappy en die samewerking van koninklike en priesterlike gesag.`,
        `Die historiese omstandighede is belangrik. Die teruggekeerde ballinge was besig om die tempel te herbou ná die verwoesting van Jerusalem. Hulle kon letterlik klippe, fondamente en onvoltooide werk rondom hulle sien. Sagaria se simboliese handeling plaas hulle huidige bouwerk binne ’n groter verwagting van wat God nog sou doen.`,
        `Die kroon word daarna nie Jesua se persoonlike eiendom nie. Dit moet in die tempel bly as ’n herinnering. ’n Voorwerp wat vir ’n kort oomblik op die priester se kop was, word ’n blywende teken dat God se beloftes verder strek as die huidige oomblik.`,
        `Vir ’n Christelike leser kom die temas van koningskap en priesterskap uiteindelik op ’n besondere manier by Jesus saam. Ons het reeds in Psalm 110 gesien hoe die Nuwe Testament hierdie twee rolle gebruik om sy werk te beskryf. Sagaria voeg ’n ander beeld by: die Loot wat God se huis bou en met koninklike gesag verbind word.`,
        `Ná die opstanding begin die betekenis van God se woonplek ook verbreed. Die eerste Christene leer om die gemeenskap van gelowiges as God se tempel te beskryf, met Christus as die Een rondom wie hierdie nuwe gemeenskap gevorm word.`,
        `Die kroon in Sagaria se tempel was daarom meer as ’n versiering. Dit was ’n herinnering dat ’n onvoltooide hede steeds binne God se groter toekoms kan staan.`
    ],
    questions: [
        `Waarom sou die ongewone kroning van ’n hoëpriester so ’n kragtige teken vir die teruggekeerde ballinge wees?`,
        `Watter onvoltooide deel van jou lewe moet jy leer sien binne God se langer werk?`
    ],
    prayer: `Here Jesus, U bou u mense saam tot ’n plek waar God se teenwoordigheid sigbaar word. Gee my geduld met wat nog onvoltooid is en help my om getrou deel te neem aan die werk wat U besig is om te doen. Amen.`,
    available: true
  },
  {
    day: 35,
    title: `Die Koning op ’n donkie`,
    theme: `Sagaria se Koning kom sonder die gewone vertoon van militêre mag en bring vrede na die nasies`,
    reading: `Sagaria 9:9-17`,
    verse: `“Jou koning sal na jou toe kom. Hy is regverdig en hy is ’n oorwinnaar, hy is nederig en hy ry op ’n donkie.”`,
    verseRef: `Sagaria 9:9 • 1983-vertaling`,
    paragraphs: [
        `’n Koning se aankoms kon ’n openbare vertoning van mag wees. Perde, strydwaens en wapens het gewys dat hierdie heerser oor militêre krag beskik. Sagaria 9 laat Jerusalem egter jubel oor ’n koning wat op ’n donkie aankom.`,
        `Die donkie beteken nie dat hierdie koning swak of onbelangrik is nie. Sagaria noem hom regverdig en ’n oorwinnaar. Die verrassende element lê in die vorm wat sy koningskap aanneem. Hy kom nederig, en die volgende vers verduidelik watter soort heerskappy saam met sy koms verwag word.`,
        `Strydwaens word vernietig, oorlogsperde verdwyn en die pyl en boog word gebreek. Daarna kondig die koning vrede aan die nasies af. Sy regering strek van see tot see en tot by die uithoeke van die aarde. Sagaria plaas dus die nederige ruiter binne ’n buitengewoon groot koninkryk.`,
        `Eeue later kies Jesus doelbewus ’n donkie wanneer Hy Jerusalem binnegaan. Die skare sien ’n koningstoneel afspeel en roep Hom met woorde uit Psalm 118 tegemoet. Die Evangelies maak die verbinding met Sagaria uitdruklik. Jesus se keuse van rydier word deel van die boodskap oor wie Hy is.`,
        `Daar was egter ’n spanning wat die skare nog sou ontdek. ’n Mens kon maklik ’n koning verwag wat Jerusalem deur sigbare oorwinning sou bevry. Jesus se pad deur die stad lei binne enkele dae na die kruis. Sy koningskap word daar op ’n manier geopenbaar wat selfs sy dissipels aanvanklik nie kon verstaan nie.`,
        `Die opstanding laat hulle weer na hierdie intog kyk. Die nederigheid van die donkie en die skynbare vernedering van die kruis was nie tekens dat Jesus se koningskap misluk het nie. Die opgestane Christus stuur sy volgelinge daarna juis na die nasies, dieselfde wye horison waarvan Sagaria gepraat het.`,
        `Die donkie word so ’n eenvoudige maar sterk simbool. God se Koning hoef nie die wêreld se gewone tekens van mag na te boots om werklik te regeer nie. Sy vrede en sy oorwinning kom op ’n manier wat mense se verwagtings oor mag herskryf.`
    ],
    questions: [
        `Wat leer die kontras tussen die donkie en die oorlogswapens in Sagaria 9 jou oor Jesus se koningskap?`,

    const formatter = new Intl.DateTimeFormat("af-ZA", {
      timeZone: "Africa/Johannesburg",
      day: "numeric",
      month: "long",
      year: "numeric"
    });

    function dateForDay(dayNumber) {
      const d = new Date(Date.UTC(START_YEAR, START_MONTH - 1, START_DAY + dayNumber - 1, 12, 0, 0));
      return d;
    }

    function formatProgramDate(dayNumber) {
      return formatter.format(dateForDay(dayNumber));
    }

    function johannesburgTodayUTC() {
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Africa/Johannesburg",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).formatToParts(new Date());

      const get = type => Number(parts.find(p => p.type === type).value);
      return Date.UTC(get("year"), get("month") - 1, get("day"));
    }

    function automaticDayNumber() {
      const start = Date.UTC(START_YEAR, START_MONTH - 1, START_DAY);
      const today = johannesburgTodayUTC();
      return Math.floor((today - start) / 86400000) + 1;
    }

    function hashDayNumber() {
      const match = location.hash.match(/^#dag-(\d{1,2})$/i);
      if (!match) return null;
      const n = Number(match[1]);
      return n >= 1 && n <= 40 ? n : null;
    }

    function initialDayNumber() {
      const fromHash = hashDayNumber();
      if (fromHash) return fromHash;

      const auto = automaticDayNumber();
      if (auto < 1) return 1;
      if (auto > 40) return 40;
      return auto;
    }

    let currentDay = initialDayNumber();

    const dateLine = document.getElementById("date-line");
    const dayKicker = document.getElementById("day-kicker");
    const dayTitle = document.getElementById("day-title");
    const dayTheme = document.getElementById("day-theme");
    const dayBody = document.getElementById("day-body");
    const tocBackdrop = document.getElementById("toc-backdrop");
    const tocList = document.getElementById("toc-list");
    const tocClose = document.getElementById("toc-close");

    function renderDay(dayNumber, updateHash = false) {
      const item = PROGRAM_DAYS[dayNumber - 1];
      if (!item) return;

      currentDay = dayNumber;
      dateLine.textContent = formatProgramDate(item.day);
      dayKicker.textContent = `Dag ${item.day}`;
      dayTitle.textContent = item.title;
      dayTheme.textContent = item.theme || "";

      if (item.available) {
        const paragraphs = item.paragraphs.map(p => `<p>${p}</p>`).join("");
        const questions = item.questions.map(q => `<li>${q}</li>`).join("");

        dayBody.innerHTML = `
          <h2 class="section-title">Skriflesing</h2>
          <p class="reading-ref">Lees ${item.reading}</p>

          <h2 class="section-title">Kernvers</h2>
          <blockquote class="verse">
            <p>${item.verse}</p>
            <cite><em>${item.verseRef}</em></cite>
          </blockquote>

          <h2 class="section-title">Dagstukkie</h2>
          <div class="content">${paragraphs}</div>

          <section class="reflection">
            <h2 class="section-title">Refleksie</h2>
            <ol>${questions}</ol>
          </section>

          <section class="prayer-box">
            <h2 class="section-title">Gebed</h2>
            <p class="prayer">${item.prayer}</p>
          </section>
        `;
      } else {
        dayBody.innerHTML = `
          <h2 class="section-title">Skriflesing</h2>
          <p class="reading-ref">Lees ${item.reading}</p>
          <div class="availability-note">
            Hierdie dag se volledige dagstukkie is nie beskikbaar nie.
            
          </div>
        `;
      }

      updateNavigation();
      renderToc();

      if (updateHash) {
        history.pushState(null, "", `#dag-${dayNumber}`);
      }

      document.title = `Dag ${item.day}: ${item.title} | 40 Dae saam met die Opgestane Jesus`;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function updateNavigation() {
      const prevButtons = document.querySelectorAll(".prev-button");
      const nextButtons = document.querySelectorAll(".next-button");

      prevButtons.forEach(btn => {
        btn.disabled = currentDay <= 1;
        btn.setAttribute("aria-label", currentDay > 1 ? `Gaan na Dag ${currentDay - 1}` : "Geen vorige dag nie");
      });

      const nextDay = PROGRAM_DAYS[currentDay];
      const canGoNext = currentDay < 40 && nextDay && nextDay.available;

      nextButtons.forEach(btn => {
        btn.disabled = !canGoNext;
        btn.setAttribute("aria-label", canGoNext ? `Gaan na Dag ${currentDay + 1}` : "Volgende dag is nog nie beskikbaar nie");
      });
    }

    function goPrevious() {
      if (currentDay > 1) renderDay(currentDay - 1, true);
    }

    function goNext() {
      const next = PROGRAM_DAYS[currentDay];
      if (currentDay < 40 && next && next.available) {
        renderDay(currentDay + 1, true);
      }
    }

    document.querySelectorAll(".prev-button").forEach(btn => btn.addEventListener("click", goPrevious));
    document.querySelectorAll(".next-button").forEach(btn => btn.addEventListener("click", goNext));
    document.querySelectorAll(".toc-button").forEach(btn => btn.addEventListener("click", openToc));

    function renderToc() {
      tocList.innerHTML = PROGRAM_DAYS.map(item => {
        const classes = [
          "toc-item",
          item.day === currentDay ? "current" : "",
          !item.available ? "unavailable" : ""
        ].filter(Boolean).join(" ");

        return `
          <button type="button"
                  class="${classes}"
                  data-day="${item.day}"
                  ${item.available ? "" : "disabled"}
                  aria-label="Dag ${item.day}: ${item.title}">
            <span class="toc-day">Dag ${item.day}</span>
            <span class="toc-main">
              <strong>${item.title}</strong>
              <span class="toc-date">${formatProgramDate(item.day)} • ${item.reading}</span>
              ${item.available ? "" : '<span class="toc-status">Volledige teks kom in ’n latere weergawe</span>'}
            </span>
          </button>
        `;
      }).join("");

      tocList.querySelectorAll(".toc-item:not(.unavailable)").forEach(btn => {
        btn.addEventListener("click", () => {
          const n = Number(btn.dataset.day);
          closeToc();
          renderDay(n, true);
        });
      });
    }

    function openToc() {
      renderToc();
      tocBackdrop.classList.add("open");
      tocBackdrop.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";

      const current = tocList.querySelector(".toc-item.current");
      if (current) {
        requestAnimationFrame(() => current.scrollIntoView({ block: "center" }));
      }
    }

    function closeToc() {
      tocBackdrop.classList.remove("open");
      tocBackdrop.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
    }

    tocClose.addEventListener("click", closeToc);
    tocBackdrop.addEventListener("click", e => {
      if (e.target === tocBackdrop) closeToc();
    });

    document.addEventListener("keydown", e => {
      if (e.key === "Escape" && tocBackdrop.classList.contains("open")) closeToc();
    });

    window.addEventListener("hashchange", () => {
      const n = hashDayNumber();
      if (n && n !== currentDay) renderDay(n, false);
    });

    renderDay(currentDay, false);
  </script>
</body>
</html>
