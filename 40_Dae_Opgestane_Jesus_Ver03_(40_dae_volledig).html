<!DOCTYPE html>
<html lang="af">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#245979">
  <title>40 Dae saam met die Opgestane Jesus</title>

  <style>
    :root {
      --sky-1: #e8f3f9;
      --sky-2: #d8eaf4;
      --blue-950: #16344d;
      --blue-900: #1c4260;
      --blue-800: #245979;
      --blue-700: #2e6f95;
      --blue-600: #3e82a8;
      --blue-200: #cfe2ed;
      --blue-100: #eaf4f9;

      --ink: #243743;
      --ink-soft: #405562;
      --muted: #647785;

      --paper: #dcecf5;
      --warm: #f5f0e6;
      --line: #d8e2e7;

      --shadow: 0 10px 34px rgba(27, 67, 93, .11);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    html {
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background:
        linear-gradient(180deg, var(--sky-2) 0, #edf4f7 210px, #f3f1eb 520px, #f3f1eb 100%);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", Times, serif;
      font-size: 18px;
      font-weight: 500;
      line-height: 1.72;
      letter-spacing: .002em;
    }

    button, .ui-font, .section-title, .day-kicker, .date-line, .site-title, .nav-button, .toc-title,
    .toc-day, .toc-date, .toc-status {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    main {
      width: min(100%, 760px);
      margin: 14px auto 56px;
      padding: 0 10px;
    }

    .site-title {
      max-width: 760px;
      margin: 18px auto 8px;
      padding: 0 14px;
      color: var(--blue-950);
      text-align: center;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .04em;
    }

    .nav-panel {
      max-width: 760px;
      margin: 10px auto;
      padding: 9px;
      border: 1px solid rgba(36, 89, 121, .18);
      border-radius: 14px;
      background: rgba(246, 250, 252, .92);
      box-shadow: 0 4px 16px rgba(27, 67, 93, .07);
    }

    .nav-label {
      margin: 0 0 7px;
      color: #5b7180;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .nav-row {
      display: grid;
      grid-template-columns: 1fr 1.15fr 1fr;
      gap: 7px;
    }

    .nav-button {
      appearance: none;
      width: 100%;
      min-height: 43px;
      border: 1px solid #b8cfdb;
      border-radius: 10px;
      padding: 8px 6px;
      background: #fdfefe;
      color: var(--blue-900);
      font-size: 13px;
      line-height: 1.2;
      font-weight: 750;
      cursor: pointer;
    }

    .nav-button.primary {
      background: var(--blue-800);
      border-color: var(--blue-800);
      color: white;
    }

    .nav-button:disabled {
      opacity: .38;
      cursor: default;
    }

    .page {
      overflow: hidden;
      background: var(--paper);
      border: 1px solid rgba(62, 93, 111, .14);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .hero {
      padding: 26px 23px 24px;
      background:
        radial-gradient(circle at 92% 12%, rgba(255,255,255,.14), transparent 27%),
        linear-gradient(145deg, var(--blue-700), var(--blue-950));
      color: white;
    }

    .date-line {
      margin: 0 0 5px;
      color: rgba(255,255,255,.93);
      font-size: 15px;
      line-height: 1.25;
      font-weight: 700;
    }

    .day-kicker {
      margin-bottom: 7px;
      text-transform: uppercase;
      letter-spacing: .13em;
      font-size: 12px;
      font-weight: 800;
      opacity: .78;
    }

    h1 {
      margin: 0 0 9px;
      color: white;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 8.5vw, 3.15rem);
      line-height: 1.07;
      letter-spacing: -.022em;
    }

    .theme {
      margin: 0;
      color: rgba(255,255,255,.88);
      font-style: italic;
      font-size: 1.01rem;
      line-height: 1.5;
    }

    .body {
      padding: 23px 22px 32px;
      color: #102536;
    }

    .section-title {
      margin: 29px 0 9px;
      color: var(--blue-800);
      font-size: 13px;
      line-height: 1.2;
      letter-spacing: .09em;
      text-transform: uppercase;
      font-weight: 800;
    }

    .reading-ref {
      margin: 0;
      color: var(--blue-950);
      font-weight: 700;
    }

    .verse {
      margin: 14px 0 27px;
      padding: 17px 18px 16px 19px;
      border-left: 5px solid var(--blue-600);
      border-radius: 0 12px 12px 0;
      background: var(--blue-100);
      box-shadow: inset 0 0 0 1px rgba(46, 111, 149, .08);
      font-family: Georgia, "Times New Roman", Times, serif;
      font-weight: 500;
    }

    .verse p {
      margin: 0;
      font-size: 1.075em;
      line-height: 1.62;
    }

    .verse cite {
      display: block;
      margin-top: 10px;
      color: var(--muted);
      font-size: .9em;
    }

    .content {
      color: #102536;
      font-family: Georgia, "Times New Roman", Times, serif;
      font-weight: 500;
    }

    .content p {
      margin: 0 0 1.16em;
    }

    .content em, .verse em {
      font-style: italic;
    }

    .reflection {
      margin-top: 31px;
      padding: 18px 18px 11px;
      border: 1px solid #d4e4ec;
      border-radius: 14px;
      background: #edf6fa;
      font-family: Georgia, "Times New Roman", Times, serif;
      font-weight: 500;
    }

    .reflection .section-title,
    .prayer-box .section-title {
      margin-top: 0;
    }

    .reflection ol {
      margin: 7px 0 0;
      padding-left: 1.3em;
    }

    .reflection li {
      margin-bottom: .85em;
      padding-left: .15em;
    }

    .prayer-box {
      margin-top: 18px;
      padding: 18px;
      border-radius: 14px;
      background: var(--warm);
      font-family: Georgia, "Times New Roman", Times, serif;
      font-weight: 500;
    }

    .prayer-box .section-title {
      color: #695b43;
    }

    .prayer {
      margin: 0;
      font-style: italic;
    }

    .availability-note {
      margin: 18px 0 4px;
      padding: 18px;
      border: 1px solid #c9dae4;
      border-radius: 12px;
      background: rgba(255,255,255,.46);
      color: #415967;
    }

    /* Inhoudsopgawe */
    .toc-backdrop {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: none;
      background: rgba(15, 35, 49, .58);
      padding: max(12px, env(safe-area-inset-top)) 10px max(12px, env(safe-area-inset-bottom));
    }

    .toc-backdrop.open {
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    .toc-dialog {
      width: min(100%, 720px);
      max-height: calc(100vh - 24px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border-radius: 17px;
      background: #f4f9fb;
      box-shadow: 0 18px 50px rgba(10, 30, 43, .28);
    }

    .toc-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 15px 16px 12px;
      border-bottom: 1px solid #d6e4ec;
      background: #e4f0f6;
    }

    .toc-title {
      flex: 1;
      margin: 0;
      color: var(--blue-950);
      font-size: 18px;
      font-weight: 800;
    }

    .toc-close {
      appearance: none;
      width: 42px;
      height: 42px;
      border: 1px solid #b6cbd8;
      border-radius: 10px;
      background: white;
      color: var(--blue-950);
      font-size: 22px;
      cursor: pointer;
    }

    .toc-list {
      overflow-y: auto;
      padding: 8px;
      overscroll-behavior: contain;
    }

    .toc-item {
      width: 100%;
      display: grid;
      grid-template-columns: 50px 1fr;
      gap: 9px;
      align-items: start;
      margin: 0 0 7px;
      padding: 11px 10px;
      border: 1px solid #d4e3eb;
      border-radius: 11px;
      background: white;
      color: #17384c;
      text-align: left;
      cursor: pointer;
    }

    .toc-item.current {
      border-color: var(--blue-700);
      box-shadow: inset 4px 0 0 var(--blue-700);
      background: #eef7fb;
    }

    .toc-item.unavailable {
      opacity: .55;
      cursor: default;
    }

    .toc-day {
      color: var(--blue-800);
      font-size: 12px;
      font-weight: 850;
      text-transform: uppercase;
    }

    .toc-main strong {
      display: block;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 16px;
      line-height: 1.25;
      font-weight: 700;
    }

    .toc-date {
      display: block;
      margin-top: 4px;
      color: #667c89;
      font-size: 12px;
      font-weight: 600;
    }

    .toc-status {
      display: block;
      margin-top: 4px;
      color: #6b7e88;
      font-size: 11px;
      font-style: italic;
    }

    @media (max-width: 520px) {
      body {
        font-size: 18.5px;
      }

      main {
        padding: 0 8px;
        margin-top: 10px;
      }

      .site-title {
        margin-top: 12px;
      }

      .hero {
        padding: 22px 19px 21px;
      }

      .body {
        padding: 21px 18px 28px;
      }

      .verse {
        padding: 16px 15px 15px 17px;
      }

      .nav-panel {
        margin-left: 8px;
        margin-right: 8px;
      }

      .nav-button {
        min-height: 42px;
        font-size: 12.5px;
      }

      .toc-dialog {
        max-height: calc(100vh - 20px);
      }
    }

    @media (min-width: 700px) {
      body { font-size: 19px; }
      .body {
        padding-left: 34px;
        padding-right: 34px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        scroll-behavior: auto !important;
        animation: none !important;
        transition: none !important;
      }
    }

    /* =========================
       VER02 OVERRIDES
       ========================= */

    body {
      overflow-x: hidden;
    }

    .site-title {
      display: none;
    }

    .top-hero {
      position: relative;
      width: 100vw;
      margin: 0;
      overflow: hidden;
      background: var(--blue-950);
      aspect-ratio: 3 / 1;
      min-height: 118px;
      max-height: 240px;
    }

    .top-hero-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .top-hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        90deg,
        rgba(16, 37, 54, .18) 0%,
        rgba(16, 37, 54, .04) 48%,
        rgba(16, 37, 54, .12) 100%
      );
      pointer-events: none;
    }

    .top-hero-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 18px;
      text-align: center;
    }

    .top-hero-title {
      max-width: 92vw;
      color: #ffffff;
      font-family: Georgia, "Times New Roman", Times, serif;
      font-size: clamp(1.55rem, 7.2vw, 3.15rem);
      line-height: 1.08;
      font-weight: 700;
      letter-spacing: -.018em;
      text-shadow:
        -1px -1px 0 #173d59,
         1px -1px 0 #173d59,
        -1px  1px 0 #173d59,
         1px  1px 0 #173d59,
         0 2px 5px rgba(10, 28, 42, .48);
    }

    .nav-panel {
      padding: 6px 8px;
      margin-top: 8px;
      margin-bottom: 8px;
    }

    .nav-label {
      margin-bottom: 4px;
      font-size: 10px;
      letter-spacing: .09em;
    }

    .nav-row {
      gap: 6px;
    }

    .nav-button {
      min-height: 32px;
      padding: 4px 5px;
      border-radius: 8px;
      font-size: 12.5px;
      line-height: 1.1;
    }

    .hero {
      padding-top: 21px;
      padding-bottom: 21px;
    }

    .hero-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
      margin: 0 0 7px;
      color: rgba(255,255,255,.9);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 13px;
      line-height: 1.25;
      font-weight: 750;
    }

    .date-line,
    .day-kicker {
      margin: 0;
      color: inherit;
      font-size: inherit;
      line-height: inherit;
      font-weight: inherit;
      letter-spacing: normal;
      text-transform: none;
      opacity: 1;
    }

    .hero-dot {
      color: rgba(255,255,255,.72);
      font-size: 1em;
      line-height: 1;
    }

    .hero h1 {
      margin-bottom: 8px;
      font-size: clamp(1.45rem, 5.8vw, 2.2rem);
      line-height: 1.12;
      letter-spacing: -.016em;
    }

    @media (max-width: 520px) {
      .top-hero {
        min-height: 112px;
      }

      .top-hero-overlay {
        padding: 10px 14px;
      }

      .top-hero-title {
        font-size: clamp(1.5rem, 7.1vw, 2rem);
        max-width: 94vw;
      }

      .nav-panel {
        margin-left: 8px;
        margin-right: 8px;
        padding: 5px 6px;
      }

      .nav-button {
        min-height: 30px;
        padding: 3px 4px;
        font-size: 12px;
      }

      .hero {
        padding: 19px 18px 19px;
      }

      .hero h1 {
        font-size: clamp(1.42rem, 6vw, 1.9rem);
      }
    }

  </style>
</head>

        `Dan verskuif die aandag na die Skrif. Jesus herinner hulle aan wat Hy vroeër geleer het en verwys na die Wet van Moses, die Profete en die Psalms. Die gebeure wat die dissipels pas beleef het, kry betekenis wanneer dit binne God se groter verhaal geplaas word.`,

    ],
    prayer: `God van lewe, dankie dat U u skepping nie prysgegee het toe sonde daarin gekom het nie. Help my om u verhaal van herstel met geloof te lees en met hoop op Christus se oorwinning te leef. Amen.`,

  {
    day: 4,
    title: `’n Seën vir die wêreld`,
    theme: `Deur Abraham word die nasies geseën`,
    reading: `Genesis 12:1-3`,
    verse: `“Ek sal seën wie jou seën, en hom vervloek wat jou vervloek. In jou sal al die volke van die aarde geseën wees.”`,
    verseRef: `Genesis 12:3 • 1983-vertaling`,
    paragraphs: [
        `Die plek waar Genesis 12 in die verhaal staan, is maklik om mis te kyk. Die vorige hoofstuk vertel van Babel. Mense probeer vir hulleself ’n groot naam maak, en die verhaal eindig met mense wat oor die aarde versprei word. Dan begin Genesis 12 met God wat een man roep: Abram.`,
        `Daardie volgorde is betekenisvol. Ná ’n verhaal waarin die volke verstrooi word, begin God ’n nuwe hoofstuk waarin die volke weer uitdruklik ter sprake kom.`,
        `Abram moet vertrek na ’n land wat God vir hom sal wys. Hy ontvang groot beloftes oor sy toekoms en sy nageslag. Tog strek die belofte veel verder as Abram se eie familie: “In jou sal al die volke van die aarde geseën wees.”`,
        `Die roeping van Abraham het dus van die begin af ’n wêreldwye horison. God se werk met hierdie een familie sal uiteindelik betekenis vir ander volke hê.`,
        `Dit word besonder interessant wanneer ons Genesis 12 vanuit Lukas 24 lees. Die opgestane Jesus sê dat die boodskap van bekering en vergewing vanaf Jerusalem na die nasies sal gaan. Daardie beweging na die nasies verskyn reeds vroeg in Genesis. Die sending van die kerk groei uit ’n verhaal wat eeue tevore begin het.`,
        `Abram self kon nog bitter min van die uiteindelike omvang van die belofte sien. Hy moes sy reis begin terwyl ’n groot deel van die vervulling ver buite sy eie leeftyd gelê het. Dit gee aan geloof ’n interessante perspektief. Ons gehoorsaamheid kan deel word van iets waarvan ons self slegs ’n klein gedeelte sien.`,
        `Die res van die Ou Testament sal die vraag verder ontwikkel: Hoe sal die seën wat aan Abraham belowe is die wêreld bereik?`,
        `Vir die Christelike leser kom daardie vraag uiteindelik by Jesus uit. Hy staan binne Abraham se verhaal, en deur Hom gaan die goeie nuus na mense ver buite die grense van Abraham se eie land.`,
        `Genesis 12 herinner ons daarom vroeg in hierdie reis dat God se verlossingsverhaal altyd ’n wyer horison gehad het.`
    ],
    questions: [
        `Wat leer Abram se roeping jou oor geloof wanneer jy nog nie die volledige uitkoms kan sien nie?`,
        `Hoe kan die seën wat jy van God ontvang ook deur jou lewe na ander mense vloei?`
    ],
    prayer: `Here, dankie dat u bedoeling van seën verder strek as wat ek self kan sien. Gee my geloof om U te volg, ook wanneer ek slegs ’n klein deel van u groter werk kan waarneem. Amen.`,
    available: true
  },
  {
    day: 5,
    title: `Die Here voorsien`,
    theme: `Die geliefde seun en die offer wat God voorsien`,
    reading: `Genesis 22:1-18`,
    verse: `“Toe noem Abraham die plek: ‘Die Here voorsien.’ Daar word nou nog gesê: ‘Op die berg van die Here word voorsien.’”`,
    verseRef: `Genesis 22:14 • 1983-vertaling`,
    paragraphs: [
        `Genesis 22 is ’n ontstellende verhaal. Abraham word gevra om Isak te neem en hom as offer te bring. Juis deur Isak het God belowe dat Abraham se nageslag sou voortgaan. Die leser voel daarom die spanning vanaf die eerste verse.`,
        `Op pad na die berg merk Isak iets op. Daar is vuur en hout vir die offer, maar hy kan geen offerlam sien nie. Abraham antwoord: “My seun, God sal sy eie offerlam voorsien.” Die verhaal laat daardie antwoord vir ’n tyd lank in die lug hang.`,
        `Eers op die berg word dit duidelik hoe voorsiening gaan lyk. Abraham sien ’n ram wat in ’n bos vasgevang is. Die ram word in Isak se plek geoffer.`,
        `Abraham gee daarna aan die plek ’n naam: “Die Here voorsien.” In Bybelse verhale dra plekname dikwels herinneringe. Hierdie naam bewaar wat Abraham daar beleef het. Op die plek waar hy geen uitweg kon sien nie, het God voorsien.`,
        `Daar is nog ’n interessante verbinding wat baie lesers maklik miskyk. Genesis plaas die gebeurtenis in die gebied van Moria. Eeue later vertel 2 Kronieke 3:1 dat Salomo die tempel in Jerusalem op Moria gebou het. Die naam Moria word dus later verbind met die plek waar Israel se tempel en offerdiens sou staan.`,
        `Vir ’n Christelike leser word die beeld van ’n geliefde seun en ’n offer wat voorsien word besonder betekenisvol wanneer ons by die kruis kom. Die ram wat in Isak se plek sterf, gee reeds taal waarmee die gedagte van plaasvervangende offer verstaan kan word.`,
        `Genesis 22 bly in die eerste plek die verhaal van Abraham en Isak. Tog leer die groter Bybelse verhaal ons om raak te sien hoe sekere beelde oor eeue heen nuwe diepte verkry. Offer, voorsiening en die geliefde seun kom later weer saam wanneer die evangelie die dood van Jesus vertel.`,
        `Abraham kon tydens die reis nog nie sien hoe die verhaal sou eindig nie. Aan die einde kon hy die plek benoem vanuit wat hy daar van God geleer het: <strong>Die Here voorsien.</strong>`
    ],
    questions: [
        `Watter betekenis kry Abraham se woorde “God sal voorsien” wanneer jy die einde van die verhaal ken?`,
        `Hoe help die ram wat in Isak se plek geoffer word jou om oor Christus se offer te dink?`
    ],
    prayer: `Here, dankie dat U deur die Skrif wys hoe diep die verhaal van verlossing loop. Help my om u voorsiening te vertrou en om Christus se offer met groter begrip en dankbaarheid te ontvang. Amen.`,
    available: true
  },
  {
    day: 6,
    title: `Die Koning uit Juda`,
    theme: `Die belofte van heerskappy binne Jakob se seën`,
    reading: `Genesis 49:8-12`,
    verse: `“Jy sal altyd heers, jy sal aanhou regeer totdat Silo kom, die heerser aan wie die volke hulle sal onderwerp.”`,
    verseRef: `Genesis 49:10 • 1983-vertaling`,
    paragraphs: [
        `Teen die einde van Genesis roep Jakob sy seuns bymekaar en spreek hy oor hulle toekoms. Wanneer hy by Juda kom, word die taal opvallend koninklik. Juda word met ’n leeu verbind, en die volgende verse praat oor heerskappy.`,
        `Dit is interessant wanneer ’n mens terugdink aan Juda se geskiedenis in Genesis. Hy tree nie deurgaans op soos iemand wat vanselfsprekend die draer van ’n groot koninklike belofte sou wees nie. Tog word Juda later die stam waaruit koning Dawid kom. Vanaf Dawid word die verwagting van ’n toekomstige koning uit sy huis een van die groot drade wat deur die Ou Testament loop.`,
        `Genesis 49:10 bevat ook ’n detail wat ons in die Afrikaanse 1983-vertaling maklik kan miskyk. Die vertaling gebruik die woord <strong>“Silo”</strong>. Die onderliggende Hebreeuse formulering is besonder oud en moeilik om met sekerheid te verklaar. Daarom verskil Bybelvertalings oor die presiese weergawe daarvan.`,
        `Ons hoef egter nie die hele betekenis van die gedeelte op die verklaring van daardie een woord te laat rus nie. Die groter beeld is helder. Juda word met voortgaande heerskappy verbind, en die volke kom binne die omvang van die toekomstige heerser se gesag.`,
        `Dit laat ons terugdink aan Abraham. In Genesis 12 het God belowe dat al die volke van die aarde deur Abraham geseën sou word. Nou, naby die einde van Genesis, begin daardie wêreldwye belofte ook ’n koninklike vorm aanneem.`,
        `Wanneer die Nuwe Testament Jesus met Juda en die huis van Dawid verbind, staan Hy dus binne ’n lang verhaal. Die titel “Christus” dra eeue se verwagting saam. Israel het geleer om uit te sien na God se beloofde koning.`,
        `Dit help ons ook om die dissipels ná die kruis beter te verstaan. Hulle het geglo Jesus is hierdie Koning. Sy dood het daarom hulle verwagtings geskud. Die opstanding sou hulle dwing om koningskap opnuut te verstaan. God se beloofde Koning het deur die dood gegaan en leef. Sy heerskappy sou uiteindelik veel verder strek as Juda of Israel alleen.`
    ],
    questions: [
        `Wat leer Genesis 49 jou oor hoe ’n Bybelse belofte oor baie geslagte heen kan ontwikkel?`,
        `Wat beteken dit in jou daaglikse lewe om Jesus as Koning te erken?`
    ],
    prayer: `Here Jesus, help my om die lang verhaal van u koningskap in die Skrif raak te sien. Leer my om u gesag met vertroue te erken en my lewe gewillig onder u heerskappy te plaas. Amen.`,
    available: true
  },
  {
    day: 7,
    title: `Die Paaslam en bevryding`,
    theme: `God gee aan Israel ’n teken van beskerming en ’n maaltyd om sy verlossing te onthou`,
    reading: `Eksodus 12:1-14`,
    verse: `“Die bloed aan die huise waarin julle is, sal ’n teken wees: waar Ek die bloed sien, sal Ek die huis oorslaan.”`,
    verseRef: `Eksodus 12:13 • 1983-vertaling`,
    paragraphs: [
        `Eksodus 12 staan op die drumpel van Israel se bevryding uit Egipte. Ná jare van slawerny kom die beslissende nag nader. God gee aan Moses besonder presiese instruksies oor ’n maaltyd wat elke huishouding moet voorberei. ’n Lam word geslag, die bloed word aan die deurkosyne gesmeer en die gesin eet gereed om te vertrek.`,
        `Een van die opvallendste besonderhede is die houding waarin hulle die maaltyd moet eet. Hulle is aangetrek vir die reis, met skoene aan en ’n kierie in die hand. Die maaltyd word dus geëet deur mense wat verwag dat God gaan optree. Hulle eet binne ’n huis, terwyl hulle reeds gereed staan om daardie huis agter te laat.`,
        `Die bloed aan die deurkosyne dien as teken. Wanneer oordeel deur Egipte gaan, word die huise wat deur die bloed aangedui is gespaar. Die Hebreeuse verhaal van die <em>Pesach</em>, waaruit ons woord Paasfees ontwikkel het, word hiermee ’n blywende herinnering aan God se bevryding. Israel moet hierdie nag later aan volgende geslagte vertel.`,
        `Dit is belangrik dat die Paasfees van die begin af meer as ’n private herinnering is. Gesinne eet saam, en die gebeurtenis word deel van die identiteit van ’n hele volk. Jaar ná jaar moes Israel onthou dat hulle bestaan as vry mense uit God se reddende hand voortgekom het.`,
        `Wanneer die Nuwe Testament oor Jesus se dood praat, verskyn die taal van die Paasfees weer. Die vroeë Christene het in die kruis die beslissende verlossingsdaad van God herken. Die ou verhaal van ’n lam, bloed en bevryding het taal verskaf waarmee hulle die betekenis van Christus se dood kon verstaan.`,
        `Ons reis deur die Ou Testament bring ons daarom vandag by een van Israel se diepste herinneringe. God se volk moes gereeld terugkyk na die nag toe Hy hulle uit slawerny gelei het. Christelike geloof leef op dieselfde manier uit herinnering aan God se verlossende optrede in Christus.`
    ],
    questions: [
        `Waarom dink jy het God ’n jaarlikse maaltyd gebruik om Israel se herinnering aan die uittog lewend te hou?`,
        `Watter plek het doelbewuste herinnering aan Christus se verlossing in jou eie geloofslewe?`
    ],
    prayer: `Here, dankie dat U ’n God van bevryding is. Help my om u reddende werk te onthou en met dankbaarheid te leef uit wat U in Christus vir ons gedoen het. Amen.`,
    available: true
  },
  {
    day: 8,
    title: `Brood vir vandag`,
    theme: `God leer sy volk om daagliks van sy voorsiening afhanklik te leef`,
    reading: `Eksodus 16:1-15`,
    verse: `“Dit is die brood wat die Here vir julle gee om te eet.”`,
    verseRef: `Eksodus 16:15 • 1983-vertaling`,
    paragraphs: [
        `Israel het Egipte verlaat, maar die woestyn stel hulle vertroue baie gou op die proef. Wanneer kos skaars raak, begin die volk terugverlang na die vleispotte van Egipte. Slawerny begin in hulle herinnering amper aantreklik lyk omdat hulle huidige omstandighede onseker is. Honger kan ’n mens se geheue merkwaardig selektief maak.`,
        `God antwoord deur kos uit die hemel te gee. Elke oggend lê daar iets vreemds op die grond, en die Israeliete vra vir mekaar: “Wat is dit?” Hierdie vraag hou waarskynlik verband met die naam <em>manna</em>. Die voedsel wat hulle vir veertig jaar sou onderhou, begin dus met verwondering oor iets wat hulle nog nooit tevore gesien het nie.`,
        `Die manier waarop die manna versamel word, is net so belangrik soos die manna self. Die volk moet elke dag die voorraad vir daardie dag optel. Eksodus 16:4 beklemtoon hierdie daaglikse ritme uitdruklik. God se voorsiening word daarmee ook ’n oefening in vertroue. Môre se behoefte sal môre weer voor God gebring word.`,
        `Dit is waarskynlik een rede waarom hierdie verhaal later so ’n kragtige geloofsbeeld word. Afhanklikheid van God word nie een keer vir altyd aangeleer nie. Dit word oor baie gewone dae gevorm. Israel word wakker, gaan uit en ontdek weer dat daar genoeg is vir vandag.`,
        `Eeue later gebruik Jesus die beeld van brood wanneer Hy oor Homself en die lewe wat God gee, praat. Vir mense wat die verhaal van manna geken het, sou “brood uit die hemel” ’n hele wêreld van herinneringe oproep. Dit herinner aan ’n volk wat in ’n dor landskap ontdek het dat hulle lewe uiteindelik van God se voorsiening afhanklik is.`,
        `Ons hou dikwels van sekerheid wat ver vooruit strek. Die manna-verhaal bring ons terug na ’n eenvoudiger vraag: Kan ek God vandag vertrou vir wat vandag nodig is? Veertig jaar se manna het uit ’n lang reeks gewone oggende bestaan. Só word vertroue dikwels gevorm.`
    ],
    questions: [
        `Waarom sou die daaglikse versameling van manna Israel se vertroue in God gevorm het?`,
        `Watter behoefte vir vandag vind jy moeilik om rustig aan God toe te vertrou?`
    ],
    prayer: `Vader, dankie vir u daaglikse sorg. Leer my om u voorsiening raak te sien en vandag met vertroue te ontvang wat U gee, sonder om deur môre se onsekerheid oorheers te word. Amen.`,
    available: true
  },
  {
    day: 9,
    title: `Is die Here by ons?`,
    theme: `Dors in die woestyn bring ’n dieper vraag oor God se teenwoordigheid na vore`,
    reading: `Eksodus 17:1-7`,
    verse: `“Is die Here by ons of nie?”`,
    verseRef: `Eksodus 17:7 • 1983-vertaling`,
    paragraphs: [
        `Refidim behoort volgens die verloop van die verhaal net nog ’n kampterrein op Israel se reis te wees. Wanneer die volk daar aankom, is daar egter geen water nie. In ’n woestyn is dit ’n ernstige krisis. Hulle dors is werklik, en die spanning neem vinnig toe totdat Moses vrees dat die volk hom met klippe kan doodgooi.`,
        `Die verhaal bevat ’n besonder interessante detail. Eksodus 17:1 sê dat Israel <strong>op bevel van die Here</strong> van plek tot plek getrek het totdat hulle by Refidim gekom het. Hulle bevind hulle dus op ’n plek sonder water terwyl hulle juis die pad gevolg het waarop God hulle gelei het. Moeilike omstandighede beteken nie vanself dat hulle van God se pad afgedwaal het nie.`,
        `Die krisis bring ’n vraag na die oppervlak wat dieper gaan as hulle dors: “Is die Here by ons of nie?” Die probleem by Refidim is uiteindelik ook ’n geloofskrisis. Israel het die Rooisee beleef en kort tevore manna ontvang. Nou word God se teenwoordigheid weer bevraagteken omdat die huidige nood oorweldigend voel.`,
        `Moses noem die plek <strong>Massa en Meriba</strong>. Die name hou verband met toetsing en rusie, en dien later as ’n waarskuwing in Israel se herinnering. Die plek waar water uit die rots gekom het, word onthou as die plek waar die volk gevra het of God werklik by hulle is.`,
        `Daar is ook iets treffends aan God se antwoord. Hy sê vir Moses dat Hy daar voor hom by die rots sal staan. Water vloei uit die plek waar God belowe het om teenwoordig te wees. Die vraag oor teenwoordigheid word dus binne die verhaal beantwoord deur God se voorsiening.`,
        `Die vraag van Refidim bly herkenbaar. Ons vra dit soms in ander woorde wanneer ’n situasie droog en onverstaanbaar word. Eksodus 17 herinner ons dat geloof gevorm word wanneer ons God se teenwoordigheid ook binne moeilike gedeeltes van die reis leer vertrou.`
    ],
    questions: [
        `Waarom dink jy het die nood by Refidim Israel so vinnig aan God se teenwoordigheid laat twyfel?`,
        `Hoe kan herinnering aan God se vorige trou jou help wanneer ’n huidige situasie onseker voel?`
    ],
    prayer: `Here, wanneer my omstandighede my onseker maak, help my om u teenwoordigheid te vertrou. Herinner my aan u trou en gee my geloof om U ook in moeilike gedeeltes van die reis te volg. Amen.`,
    available: true
  },
  {
    day: 10,
    title: `Die sonde word weggedra`,
    theme: `Die Groot Versoendag gee aan Israel ’n sigbare beeld van skuld wat verwyder word`,
    reading: `Levitikus 16:15-22`,
    verse: `“So sal die bok al hulle sonde met hom saamdra na ’n onherbergsame streek toe.”`,
    verseRef: `Levitikus 16:22 • 1983-vertaling`,
    paragraphs: [
        `Levitikus kan vir ’n moderne leser vreemd voel omdat die boek ons binne ’n wêreld van priesters, offers en reinheidsrituele neem. Hoofstuk 16 beskryf die Groot Versoendag, een van die belangrikste dae in Israel se godsdienstige kalender. Op hierdie dag word versoening vir die volk gedoen, en twee bokke speel ’n besondere rol in die ritueel.`,
        `Die eerste bok word as sondeoffer gebring. Die tweede bly lewe. Aäron plaas sy hande op die kop van hierdie bok en bely die oortredinge van Israel daaroor. Daarna word die dier weggelei na die woestyn, ’n onbewoonde ruimte buite die gemeenskap.`,
        `Probeer jou voorstel hoe sterk hierdie beeld vir iemand sou wees wat die ritueel aanskou. Skuld is onsigbaar. ’n Mens kan dit nie optel en by ’n deur uitdra nie. Op die Groot Versoendag word die verwydering van skuld egter sigbaar uitgebeeld wanneer die bok al verder van die kamp af verdwyn.`,
        `Die handeling sê iets belangriks oor vergifnis. Sonde word ernstig opgeneem, en versoening bring werklike verwydering van skuld mee. Israel ontvang ’n ritueel waarin die volk kan sien hoe dit wat tussen hulle en God staan, simbolies weggedra word.`,
        `Hierdie beeld help ’n Christelike leser om taal in die Nuwe Testament beter te verstaan. Wanneer Jesus se dood beskryf word as die dra van sonde, staan daardie taal binne ’n baie ouer Bybelse wêreld. Die eerste Christene het reeds Skrifte gehad waarin offer, versoening en die wegdra van skuld diep in Israel se aanbidding ingebed was.`,
        `Ons hoef dus nie haastig oor Levitikus te lees omdat die rituele vir ons vreemd voel nie. Juis die vreemdheid kan ons help om weer te besef hoe ernstig vergifnis in die Bybel behandel word. Die lewende bok wat uit die kamp verdwyn, laat een eenvoudige beeld agter: God maak ’n weg waardeur skuld verwyder kan word.`
    ],
    questions: [
        `Wat leer die beeld van die bok wat die sonde wegdra jou oor die betekenis van vergifnis?`,
        `Is daar skuld wat jy steeds saamdra hoewel jy dit reeds aan God bely het?`
    ],
    prayer: `Genadige God, dankie dat U vergifnis gee en skuld wegneem. Help my om u genade met erns te ontvang en om te leef in die vryheid wat Christus se versoening bring. Amen.`,
    available: true
  },
  {
    day: 11,
    title: `Kyk en leef`,
    theme: `Die koperslang word ’n teken van lewe vir mense wat deur die slange gepik is`,
    reading: `Numeri 21:4-9`,
    verse: `“Elkeen wat gepik is en daarna opkyk, sal lewe.”`,
    verseRef: `Numeri 21:8 • 1983-vertaling`,
    paragraphs: [
        `Die verhaal van die koperslang is een van die vreemdste episodes tydens Israel se woestynreis. Die volk raak ongeduldig en vaar teen God en Moses uit. Giftige slange kom onder hulle, en baie mense sterf. Wanneer die volk hulle sonde erken, bid Moses vir hulle.`,
        `God se opdrag is onverwags. Moses moet ’n afbeelding van ’n slang maak en dit op ’n paal sit. Iemand wat gepik is, moet na die slang opkyk en sal lewe. Die teken wat voor hulle opgelig word, dra dus die beeld van dieselfde gevaar wat hulle in die kamp ervaar het.`,
        `Daar is geen ingewikkelde handeling waarmee die sterwende persoon homself genees nie. Hy moet kyk na die teken wat God gegee het. Die eenvoud daarvan maak die verhaal amper ontstellend. Lewe word ontvang deur vertroue in God se aangewese middel van redding.`,
        `Hierdie Ou-Testamentiese gebeurtenis kry ’n besondere plek in die Evangelie volgens Johannes. Wanneer Jesus met Nikodemus praat, verwys Hy self na Moses wat die slang in die woestyn verhoog het. Die verhaal uit Numeri word daar ’n beeld wat help om Jesus se eie verhoging te verstaan.`,
        `Dit beteken dat die verbinding met Christus nie bloot eeue later deur Christelike lesers op die verhaal geplaas is nie. Jesus self neem hierdie vreemde woestynverhaal op en gebruik dit om oor sy komende dood te praat. Vir iemand soos Nikodemus, wat die Skrifte goed geken het, moes die verwysing opvallend gewees het.`,
        `Die opdrag in Numeri is eenvoudig: kyk en leef. Die verhaal plaas die klem op God wat ’n weg tot lewe gee aan mense wat reeds die gevolge van hulle opstand beleef. Wanneer ons later na die kruis kyk, hoor ons dieselfde tema op ’n veel groter skaal. God gee lewe waar die mens homself nie kan red nie.`,
        `’n Ou verhaal oor slange in ’n woestyn word so deel van die taal waarmee Jesus sy eie verlossingswerk verklaar. Dit is presies die soort verbinding wat ons tydens hierdie veertig dae wil leer raaksien.`
    ],
    questions: [
        `Waarom dink jy gebruik Jesus juis die verhaal van die koperslang wanneer Hy oor sy eie verhoging praat?`,
        `Wat beteken dit vir jou om jou vertroue vir lewe en verlossing op Christus te plaas?`
    ],
    prayer: `Here Jesus, dankie dat U die weg tot lewe vir ons oopgemaak het. Help my om my vertroue op U te vestig en om die diepte van u verlossingswerk al beter te verstaan. Amen.`,
    available: true
  },
  {
    day: 12,
    title: `Luister na Hom`,
    theme: `God belowe ’n Profeet soos Moses wie se woorde gehoor moet word`,
    reading: `Deuteronomium 18:15-22`,
    verse: `“Die Here jou God sal ’n profeet onder jou na vore laat kom, een van jou volksgenote. Hy sal soos ek wees.”`,
    verseRef: `Deuteronomium 18:15 • 1983-vertaling`,
    paragraphs: [
        `Moses staan naby die einde van sy lewe wanneer hy hierdie woorde tot Israel rig. Die volk wat hy uit Egipte gelei het, sal binnekort sonder hom die beloofde land binnegaan. Daarom is daar ’n belangrike vraag in die agtergrond van hierdie gedeelte: Hoe sal Israel weet wat God van hulle verwag wanneer Moses nie meer daar is om met hulle te praat nie?`,
        `Die antwoord neem hulle terug na Horeb, waar Israel die stem van God gehoor en die vuur op die berg gesien het. Die ervaring was so oorweldigend dat hulle gevra het dat Moses namens hulle na God moet luister. Moses het dus ’n besondere rol vervul. Hy het God se woord ontvang en dit aan die volk bekend gemaak.`,
        `Nou beloof God dat Hy weer ’n profeet soos Moses uit hulle eie volk sal laat opstaan. Die belangrikste opdrag aan Israel is eenvoudig: hulle moet na hom luister. Ware profesie berus volgens die res van die gedeelte op die feit dat God sy woorde in die mond van die profeet lê. Daarom dra die boodskap gesag.`,
        `Hierdie belofte word later belangrik in die Nuwe Testament. Die eerste Christene het Jesus binne hierdie verwagting van ’n profeet soos Moses verstaan. Dit help ons om een aspek van Jesus se bediening raak te sien wat soms minder aandag kry. Hy kom met die gesag om God bekend te maak en mense te leer hoe die lewe onder God se heerskappy lyk.`,
        `Dit bring ons ook terug by die Emmausgangers. Hulle stap saam met Jesus en luister terwyl Hy die Skrifte vir hulle uitlê. Hulle ontdek die identiteit van die Een wat langs hulle loop juis terwyl hulle na sy woorde luister.`,
        `Deuteronomium 18 plaas daarom ’n belangrike vraag voor elke leser van die Evangelies. As Jesus die Een is deur wie God Homself beslissend bekend maak, hoe aandagtig luister ons na Hom? Om Christus in die Skrif te herken vra meer as nuuskierigheid. Dit vra ’n bereidheid om sy woord ernstig op te neem en ons lewe daardeur te laat vorm.`
    ],
    questions: [
        `Wat beteken dit prakties vir jou om na Jesus te luister?`,
        `Is daar ’n woord van Jesus wat jy reeds goed ken, maar ernstiger behoort op te neem?`
    ],
    prayer: `Here Jesus, leer my om met aandag na U te luister. Maak my ontvanklik vir u woord en gee my die bereidheid om my lewe te laat vorm deur wat U bekend maak. Amen.`,
    available: true
  },
  {
    day: 13,
    title: `God se Gesalfde Koning`,
    theme: `Menslike weerstand kan God se besluit oor sy Koning nie ongedaan maak nie`,
    reading: `Psalm 2:1-12`,
    verse: `“Dit is Ek wat hom as my koning gesalf het op Sion, my heilige berg.”`,
    verseRef: `Psalm 2:6 • 1983-vertaling`,
    paragraphs: [
        `Psalm 2 begin op ’n onrustige wêreldtoneel. Volke kom in beroering en konings span saam teen die Here en sy gesalfde. Die Psalm plaas ons dus onmiddellik binne ’n botsing oor gesag. Aardse heersers wil hulle eie koers bepaal, terwyl God verklaar dat Hy reeds sy koning op Sion aangestel het.`,
        `Die woord <strong>gesalfde</strong> is hier besonder belangrik. In Hebreeus staan die woord <em>mashiach</em>, waaruit ons “Messias” kry. Om iemand te salf was ’n manier waarop ’n koning vir sy besondere taak afgesonder is. Wanneer die Nuwe Testament Jesus die Christus noem, gebruik dit die Griekse woord wat dieselfde grondgedagte dra: Hy is God se Gesalfde.`,
        `Die oorspronklike Psalm staan binne die wêreld van Israel se koningskap, maar sy taal strek opvallend wyd. Die koning word “seun” genoem, en die volke en die hele aarde kom binne die omvang van sy heerskappy. Dit verklaar waarom hierdie Psalm later so belangrik geword het vir die eerste Christene toe hulle probeer verwoord het wie Jesus is.`,
        `Die kruis sou aanvanklik kon lyk asof die maghebbers van die wêreld hulle sin gekry het. Jesus is verwerp en tereggestel onder die gesag van mense. Die opstanding plaas daardie gebeurtenis egter binne ’n groter werklikheid. Die Een wat verwerp is, leef, en die vroeë kerk begin Psalm 2 gebruik om die teenstand teen Jesus binne God se groter plan te verstaan.`,
        `Daar is iets vertroostends én ontstellends in die Psalm. Menslike mag lyk soms oorweldigend, maar dit is nooit die hoogste gesag nie. Terselfdertyd vra die Psalm van elke leser ’n reaksie op God se Koning. Die slot praat van mense wat by Hom skuiling soek.`,
        `Om Jesus as Messias te bely is daarom meer as om ’n titel aan sy Naam te voeg. Dit is om Hom as die Koning te erken aan wie ons lewe behoort. Die opstanding bevestig dat God se Gesalfde steeds regeer, selfs wanneer die wêreld se weerstand sterk lyk.`
    ],
    questions: [
        `Wat voeg die betekenis van “Gesalfde” of “Messias” by jou verstaan van Jesus?`,
        `In watter deel van jou lewe vind jy dit moeilik om Christus se gesag volledig te vertrou?`
    ],
    prayer: `Here Jesus, U is God se Gesalfde Koning. Help my om u gesag met vertroue te erken en om by U skuiling te vind wanneer die wêreld rondom my onseker en onrustig voel. Amen.`,
    available: true
  },
  {
    day: 14,
    title: `Die dood kry nie die laaste woord nie`,
    theme: `’n Psalm van vertroue word deel van die vroeë kerk se verkondiging van die opstanding`,
    reading: `Psalm 16:7-11`,
    verse: `“U gee my nie oor aan die dood nie. U laat u troue dienaar nie in die graf kom nie.”`,
    verseRef: `Psalm 16:10 • 1983-vertaling`,
    paragraphs: [
        `Psalm 16 klink soos die gebed van iemand wat sy veiligheid by God gevind het. Die Psalmis praat oor die Here wat hom raad gee en naby hom bly. Daarom kan hy selfs met die werklikheid van die dood voor hom oor veiligheid en lewe praat. Die vertroue bereik ’n hoogtepunt wanneer hy verklaar dat God hom nie aan die dood sal oorgee nie.`,
        `Wat hierdie vers besonder interessant maak vir ons veertig-dae-reis, is wat later daarmee gebeur. Ná Jesus se opstanding haal Petrus Psalm 16 in sy Pinksterpreek aan. Paulus gebruik dieselfde Psalm wanneer hy in Antiogië oor Jesus se opstanding preek. Albei lees die woorde oor God se troue dienaar in die lig van Christus wat uit die dood opgewek is.`,
        `Dit beteken dat die eerste Christene die opstanding nie as ’n gebeurtenis sonder ’n Bybelse agtergrond verstaan het nie. Hulle gaan terug na Israel se gebede en begin bekende woorde met nuwe oë lees. ’n Psalm wat oor vertroue in God se bewaring praat, gee aan hulle taal om die oorwinning van Jesus oor die dood te verkondig.`,
        `Daar is ’n interessante verskil tussen die ervaring van Dawid, aan wie die Psalm toegeskryf word, en die aanspraak wat die apostels oor Jesus maak. Dawid het gesterf. Sy graf was aan die mense van Petrus se tyd bekend. Jesus het ook werklik gesterf, maar sy graf het Hom nie behou nie. Daarom sien Petrus in hierdie Psalm ’n dieper vervulling wat by die opgestane Christus uitkom.`,
        `Die laaste vers van Psalm 16 praat van die “pad van die lewe”. Dit is ’n gepaste beeld vir die tyd ná Opstandingsondag. Jesus se opstanding verklaar dat die dood se grens deurbreek is en dat lewe by God verder strek as die graf.`,
        `Ons lees hierdie Psalm dus saam met gelowiges wat reeds tweeduisend jaar gelede ontdek het dat ou woorde nuwe helderheid kry wanneer hulle vanuit die leë graf gelees word. Die God by wie die Psalmis skuil, is die God wat Jesus uit die dood opgewek het.`
    ],
    questions: [
        `Waarom dink jy het Psalm 16 so belangrik geword in die eerste Christelike verkondiging?`,
        `Hoe beïnvloed die opstanding jou eie manier van dink oor lewe en dood?`
    ],
    prayer: `God van die lewe, dankie dat die graf nie die einde van Christus se verhaal was nie. Laat die hoop van die opstanding my vertroue verdiep en leer my om my lewe veilig in u hand te plaas. Amen.`,
    available: true
  },
  {
    day: 15,
    title: `Die gebed van die lydende Regverdige`,
    theme: `Psalm 22 gee taal aan diepe verlatenheid en word op besondere wyse in Jesus se lyding gehoor`,
    reading: `Psalm 22:1-18`,
    verse: `“My God, my God, waarom het U my verlaat en bly U ver as ek om hulp roep?”`,
    verseRef: `Psalm 22:2 • 1983-vertaling`,
    paragraphs: [
        `Die eerste woorde van Psalm 22 is vir Christene onmiddellik herkenbaar. Jesus gebruik hierdie gebed terwyl Hy aan die kruis hang. Dit maak die Psalm een van die gedeeltes wat Christelike lesers dikwels met die kruisiging verbind, maar die hele eerste helfte van die Psalm verdien aandag.`,
        `Dit is ’n klaaglied van iemand wat diep ly en God se nabyheid nie kan ervaar nie. Die bidder word bespot, mense skud hulle koppe oor hom en sy liggaam word deur lyding uitgeput. Later in die gedeelte praat hy selfs van sy klere wat verdeel word. Verskeie van hierdie beelde verskyn weer in die Evangelies se beskrywings van Jesus se kruisiging.`,
        `Die besondere waarde van ’n klaagpsalm lê ook daarin dat lyding hier voor God uitgespreek word. Die Psalmis verberg sy gevoel van verlatenheid nie. Tog bly sy eerste woorde “My God”. Selfs vanuit sy ontreddering spreek hy God aan as die Een tot wie hy behoort.`,
        `Binne die Psalm wissel sy aandag tussen sy huidige nood en die herinnering aan mense wat voor hom op God vertrou het. Hy onthou ook dat God reeds van sy geboorte af by hom betrokke was. Hierdie herinneringe neem die pyn nie weg nie, maar dit gee aan die bidder taal waarmee hy binne die pyn steeds na God kan roep.`,
        `Wanneer Jesus aan die kruis die openingswoorde van Psalm 22 gebruik, plaas Hy sy lyding binne hierdie gebed van Israel. Die kruisiging word so verbind met die ervaring van die lydende regverdige wat bespot word en tog sy nood tot God rig.`,
        `Ons weet vanuit Opstandingsondag hoe Jesus se verhaal verder verloop. Dit maak sy gebruik van hierdie Psalm nog aangrypender. Die verlatenheid van die kruis was werklik, en die opstanding openbaar dat God se trou verder gestrek het as die graf.`,
        `Psalm 22 leer ons daarom ook iets oor geloof in donker tye. Geloof kan soms die vorm aanneem van ’n gebed wat eenvoudig aanhou om God aan te spreek wanneer antwoorde nog buite sig bly.`
    ],
    questions: [
        `Wat tref jou wanneer jy Psalm 22 lees met Jesus se woorde aan die kruis in gedagte?`,
        `Hoe kan die Psalms jou help om eerlik met God te praat wanneer jy deur lyding gaan?`
    ],
    prayer: `My God, dankie dat ek my diepste nood voor U mag uitspreek. Wanneer ek min verstaan, help my om steeds na U te roep en my vas te hou aan u trou wat in die opstanding van Jesus bevestig is. Amen.`,
    available: true
  },
  {
    day: 16,
    title: `In u hande`,
    theme: `Vertroue plaas die lewe in God se hande wanneer gevaar naby voel`,
    reading: `Psalm 31:1-8`,
    verse: `“In u hande gee ek my lewe oor, want, Here, troue God, U het my vrygemaak.”`,
    verseRef: `Psalm 31:6 • 1983-vertaling`,
    paragraphs: [
        `Psalm 31 kom uit ’n wêreld van bedreiging. Die bidder soek skuiling by God en praat van mense wat ’n net vir hom gespan het. Hy weet nie presies hoe die gevaar opgelos gaan word nie, maar hy weet aan wie hy homself wil toevertrou. Daarom kom daar in die middel van sy gebed ’n eenvoudige verklaring: “In u hande gee ek my lewe oor.”`,
        `Die beeld van God se hand loop op ’n interessante manier deur hierdie gedeelte. Die Psalmis plaas sy lewe in God se hand, terwyl hy later sê dat God hom uit die mag van sy vyand gered het. Sy veiligheid word dus beskryf in terme van aan wie sy lewe toevertrou is.`,
        `Eeue later hoor ons die taal van hierdie Psalm weer op Golgota. Volgens Lukas bid Jesus kort voor sy dood: “Vader, in u hande gee Ek my gees oor.” Hy neem die woorde van ’n ou Israelitiese gebed op sy lippe en spreek dit in sy eie uur van dood tot sy Vader.`,
        `Dit is ’n besonder betekenisvolle manier om te sterf. Jesus se laaste woorde in Lukas is woorde wat uit die Skrif gevorm is. Die Psalms was kennelik veel meer as tekste wat gelees is. Hulle het taal geword waarmee gelowiges hulle lewe voor God kon uitspreek, selfs wanneer hulle deur uiterste lyding gegaan het.`,
        `Daar is ook ’n klein verskil wat betekenis dra. In Lukas spreek Jesus God as “Vader” aan. Die vertroue van Psalm 31 word daarmee binne die verhouding tussen die Seun en die Vader uitgespreek. Hy gaan die dood tegemoet met sy lewe aan die Vader toevertrou.`,
        `Ons lees hierdie woorde ná die opstanding. Die Een wat sy gees in die Vader se hande oorgegee het, is uit die dood opgewek. Dit gee besondere gewig aan die vertroue waarmee Psalm 31 bid.`,
        `Min van ons weet presies wat voorlê. Psalm 31 gee ons daarom ’n eenvoudige gebed wat in baie verskillende seisoene van die lewe gebid kan word. Ons kan ons lewe, ook die dele waarvan ons die uitkoms nog nie sien nie, in die hande van die troue God plaas.`
    ],
    questions: [
        `Wat sê die beeld van God se hand vir jou oor veiligheid en vertroue?`,
        `Watter deel van jou lewe vind jy tans moeilik om bewustelik aan God toe te vertrou?`
    ],
    prayer: `Troue God, in u hande plaas ek my lewe en alles wat ek nie kan beheer nie. Leer my om U te vertrou soos Jesus sy Vader vertrou het, ook wanneer die pad voor my onseker is. Amen.`,
    available: true
  },
  {
    day: 17,
    title: `Gehoorsaamheid en die wil van God`,
    theme: `Psalm 40 wys na ’n lewe wat ingestel is om God te hoor en sy wil te doen`,
    reading: `Psalm 40:6-11`,
    verse: `“Om u wil te doen, my God, is my een begeerte, u woord is my hele lewe.”`,
    verseRef: `Psalm 40:9 • 1983-vertaling`,
    paragraphs: [
        `Psalm 40 praat oor offers, maar die hart van hierdie gedeelte lê by gehoorsaamheid. Die Psalmis weet dat Israel se offerdiens deur God ingestel is. Tog besef hy dat ’n mens se verhouding met God veel dieper strek as die bring van ’n offer. Sy begeerte is om God se wil te doen en sy woord deel van sy hele lewe te maak.`,
        `Hier lê ’n interessante besonderheid wat ons Afrikaanse vertaling nie maklik laat raaksien nie. Die 1983-vertaling sê in vers 7: “U wil gehoorsaamheid hê.” Die Hebreeuse teks gebruik ’n besondere beeld wat letterlik iets soos “U het vir my ore uitgegrawe” of “oopgemaak” beteken. Die gedagte is van ’n mens wie se ore gereed gemaak is om te hoor, sodat hy kan gehoorsaam.`,
        `Dan gebeur iets nog interessanter wanneer ons by die Nuwe Testament kom. Die ou Griekse vertaling van die Ou Testament, die Septuagint, gee die frase weer as “’n liggaam het U vir my voorberei”. Hebreërs 10 gebruik juis hierdie Griekse weergawe wanneer Psalm 40 op Christus toegepas word. Die skrywer van Hebreërs verbind die Psalm met Jesus wat Homself geheel en al aan die wil van God gee.`,
        `Hierdie klein verskil tussen die Hebreeuse en Griekse teks gee vir ons ’n besondere venster op die vroeë Christelike lees van die Psalms. Die beeld van die geopende oor beklemtoon luister en gehoorsaamheid. Die Griekse weergawe laat Hebreërs verder dink aan Christus se liggaam en die offer van sy lewe.`,
        `Jesus se gehoorsaamheid loop deur sy hele aardse bediening en bereik sy diepste uitdrukking in sy bereidheid om die Vader se wil te doen, selfs waar dit Hom deur lyding neem. Ná die opstanding kon sy dissipels terugkyk en besef dat die kruis deel was van hierdie gehoorsame oorgawe.`,
        `Psalm 40 vra daarom ’n eenvoudige, indringende vraag: Is God se woord iets wat ek net hoor, of word my lewe daardeur gevorm?`
    ],
    questions: [
        `Wat voeg die beeld van ’n “oopgemaakte oor” by jou verstaan van gehoorsaamheid?`,
        `Waar vra God se woord tans van jou om dit prakties uit te leef?`
    ],
    prayer: `Here, maak my ore oop vir u woord en vorm in my ’n hart wat graag u wil doen. Laat my gehoorsaamheid uit liefde vir U groei en sigbaar word in die manier waarop ek leef. Amen.`,
    available: true
  },
  {
    day: 18,
    title: `Ywer, smaad en lyding`,
    theme: `Psalm 69 gee stem aan die lydende gelowige wie se toewyding aan God hom duur te staan kom`,
    reading: `Psalm 69:7-21`,
    verse: `“Omdat ek u huis liefhet, moet ek ly; die beledigings teen U het ook vir my getref.”`,
    verseRef: `Psalm 69:10 • 1983-vertaling`,
    paragraphs: [
        `Psalm 69 laat ons luister na iemand wat onder vernedering gebuk gaan. Hy word deur mense bespot en selfs deur sy eie familie vervreem. Wat sy lyding besonder pynlik maak, is dat ’n deel daarvan juis uit sy toewyding aan God voortkom. Sy liefde vir God se huis bring hom in die spervuur van ander mense se minagting.`,
        `Hierdie vers kry later ’n opvallende plek in die Evangelie volgens Johannes. Wanneer Jesus die tempel reinig, onthou sy dissipels die woorde oor ywer vir God se huis. Die Psalm help hulle om Jesus se optrede binne die taal van iemand te verstaan wie se toewyding aan God weerstand ontlok.`,
        `Verder in Psalm 69 kom nog ’n beeld voor wat later sterk met die kruisigingsverhaal verbind word. Die lydende persoon soek na meegevoel en vind niemand wat hom vertroos nie. Wanneer hy honger en dors is, kry hy iets bitter om te eet en asyn om te drink. Die Evangelies beskryf soortgelyke besonderhede tydens Jesus se kruisiging.`,
        `Dit beteken nie dat elke vers van Psalm 69 oorspronklik as ’n eenvoudige voorspelling van ’n toekomstige kruisiging geskryf is nie. Die eerste lesers het hier die gebed van ’n mens gehoor wat swaarkry omdat sy lewe op God gerig is. Juis daarom kon die vroeë Christene hierdie Psalm gebruik om Jesus se lyding te verstaan. Hulle het in Hom die lydende Regverdige herken wie se toewyding aan die Vader Hom in konflik met mense gebring het.`,
        `Daar is iets aangrypends aan hierdie manier waarop die Psalms in Jesus se verhaal terugkeer. Woorde wat lank voor sy geboorte gebid is, word taal waarmee sy dissipels sy lyding begin begryp. Die Ou Testament bied aan hulle ’n geestelike woordeskat vir dinge wat hulle aanvanklik glad nie kon verstaan nie.`,
        `Dit bring ons weer by die Emmauspad. Jesus leer sy volgelinge dat sy lyding binne die Skrifte ’n plek het. Psalm 69 help ons vandag om daardie les saam met hulle te leer.`
    ],
    questions: [
        `Watter nuwe betekenis kry Psalm 69 wanneer jy dit langs die verhaal van Jesus lees?`,
        `Hoe reageer jy wanneer getrouheid aan God jou iets kos?`
    ],
    prayer: `Here Jesus, dankie dat U getrou gebly het deur verwerping en lyding heen. Gee my die moed om U met ’n opregte hart te volg en om getrou te bly wanneer gehoorsaamheid moeilik word. Amen.`,
    available: true
  },
  {
    day: 19,
    title: `Die Priester-Koning`,
    theme: `Psalm 110 bring koningskap en priesterskap op ’n verrassende manier bymekaar`,
    reading: `Psalm 110:1-7`,
    verse: `“Jy sal altyd priester wees in die priesterorde van Melgisedek.”`,
    verseRef: `Psalm 110:4 • 1983-vertaling`,
    paragraphs: [
        `Psalm 110 begin met ’n koning wat deur God na die ereplek aan sy regterhand genooi word. Die eerste verse praat van heerskappy en vyande wat onderwerp word. Dan verander die Psalm skielik van rigting wanneer God verklaar dat hierdie koning ook “altyd priester” sal wees volgens die priesterorde van Melgisedek.`,
        `Melgisedek is een van die meer geheimsinnige figure in die Ou Testament. Hy verskyn kortliks in Genesis 14 wanneer Abraham van ’n veldtog terugkeer. Daar word hy beskryf as koning van Salem en priester van God die Allerhoogste. Hy seën Abraham, waarna hy amper net so vinnig uit die verhaal verdwyn as wat hy verskyn het.`,
        `Dit maak Psalm 110:4 opvallend. Israel se koningskap was met Dawid en sy nageslag verbind, terwyl die gewone priesterskap uit ’n ander stamlyn gekom het. In Melgisedek kry ons egter ’n ouer Bybelse figuur by wie koningskap en priesterskap saam voorkom. Dit is presies hierdie kombinasie wat later vir die skrywer van Hebreërs belangrik word wanneer hy Jesus se priesterskap verduidelik.`,
        `’n Priester verteenwoordig mense voor God en tree binne Israel se aanbidding op in sake van offer en versoening. ’n Koning dra gesag en is geroep om oor God se volk te regeer. Psalm 110 plaas hierdie twee beelde verrassend naby aan mekaar, en die Nuwe Testament gebruik die Psalm herhaaldelik wanneer dit oor die verhoogde Christus praat.`,
        `Dit is ook waarom die Psalm besonder gepas is vir hierdie tyd tussen Opstanding en Hemelvaart. Die dissipels moet leer dat Jesus se werk veel groter is as die politieke koningskap wat hulle vroeër verwag het. Hy is die opgestane Here wat regeer, en sy werk raak ook die mens se toegang tot God.`,
        `Psalm 110 gee ons dus nog ’n stuk van die groter prentjie. Die Messias wat gely het en opgestaan het, word in die Nuwe Testament verstaan as Koning en Priester. Die vreemde naam Melgisedek word daarmee deel van die taal waarmee die kerk die unieke betekenis van Jesus probeer verwoord.`
    ],
    questions: [
        `Wat leer die samevoeging van koning en priester jou oor die omvang van Jesus se werk?`,
        `Hoe beïnvloed dit jou geloof dat Christus ook jou toegang tot God verteenwoordig?`
    ],
    prayer: `Here Jesus, dankie dat U oor u volk regeer en ons tot God bring. Help my om die grootheid van u werk beter te verstaan en met vertroue onder u heerskappy te leef. Amen.`,
    available: true
  },
  {
    day: 20,
    title: `Die klip wat afgekeur is`,
    theme: `Menslike verwerping word binne God se werk die begin van ’n verrassende verhoging`,
    reading: `Psalm 118:19-29`,
    verse: `“Die klip wat deur die bouers afgekeur is, juis hy het die belangrikste klip in die gebou geword.”`,
    verseRef: `Psalm 118:22 • 1983-vertaling`,
    paragraphs: [
        `Psalm 118 is ’n lied van dankbaarheid ná redding uit groot nood. Die bidder kom by die tempel aan en vra dat die poorte vir hom oopgemaak word. Hy wil die Here loof omdat God sy gebed verhoor en hom gered het. Dan verskyn die onverwagte beeld van ’n klip wat deur bouers afgekeur is en uiteindelik die belangrikste klip in die gebou word.`,
        `Die beeld kom uit die wêreld van bouwerk. Iemand wat klippe keur, besluit dat ’n bepaalde steen onbruikbaar is en sit dit eenkant. Later blyk dieselfde steen ’n besondere plek in die gebou te kry. Die punt van die beeld lê in die groot omkeer tussen menslike beoordeling en God se handeling.`,
        `Jesus gebruik hierdie vers self nadat Hy die gelykenis van die boere in die wingerd vertel het. In daardie verhaal word die eienaar se seun deur die boere verwerp en doodgemaak. Daarna haal Jesus Psalm 118 aan, en sy teenstanders besef dat Hy die verhaal op hulle toepas.`,
        `Ná die opstanding kry die beeld nog groter betekenis. Petrus gebruik dieselfde Psalm wanneer hy voor die Joodse Raad oor Jesus getuig. Die Een wat deur mense verwerp en gekruisig is, word deur God tot die belangrikste klip gemaak.`,
        `Psalm 118 bevat nog ’n bekende frase. ’n Paar verse later lees ons: “Prys hom wat in die Naam van die Here kom!” Dit is woorde wat met Jesus se intog in Jerusalem verbind word. Binne een Psalm staan die verwelkoming van die komende persoon dus naby die beeld van die afgekeurde steen.`,
        `Die dissipels het die kruis aanvanklik as ’n katastrofe beleef. Die opstanding laat hulle sien dat God se oordeel oor Jesus anders was as die oordeel van die mense wat Hom verwerp het. Die afgekeurde steen het ’n ereplek ontvang.`,
        `Dit is ’n patroon wat ons deur hierdie hele reis leer herken. God se werk kan op ’n plek voortgaan wat mense reeds afgeskryf het. Die opgestane Christus is die grootste bevestiging daarvan.`
    ],
    questions: [
        `Waarom het die beeld van die afgekeurde klip so goed by die eerste Christene se ervaring van Jesus gepas?`,
        `Waar het jy nodig om God se oordeel oor ’n situasie meer te vertrou as menslike beoordeling?`
    ],
    prayer: `Here Jesus, U is die Een wat verwerp is en deur God verhoog is. Help my om my vertroue op U te bou en om met hoop te kyk na plekke waar ek nog net mislukking of verlies raaksien. Amen.`,
    available: true
  },
  {
    day: 21,
    title: `Immanuel`,
    theme: `God gee binne ’n tyd van vrees die teken van sy teenwoordigheid`,
    reading: `Jesaja 7:10-17`,
    verse: `“’n Jong vrou sal swanger word en ’n seun in die wêreld bring en sy sal hom Immanuel noem.”`,
    verseRef: `Jesaja 7:14 • 1983-vertaling`,
    paragraphs: [
        `Jesaja 7 speel af tydens ’n politieke krisis. Koning Agas van Juda hoor dat twee vyandige konings teen Jerusalem optrek, en vrees gryp hom en sy volk aan. Jesaja word na hom gestuur met die boodskap dat hy rustig moet bly en op die Here moet vertrou. Dit is binne hierdie gespanne situasie dat die teken van Immanuel gegee word.`,
        `Die naam is die sleutel tot die teken. <em>Immanuel</em> beteken “God by ons”. Vir Agas moes dit ’n baie konkrete betekenis hê. Die bedreiging waarvoor hy bang was, sou nie die verloop van die geskiedenis bepaal nie. God was steeds by sy volk en sou handel binne die wêreld wat vir hulle so onseker geword het.`,
        `Die teken het dus ’n betekenis binne Jesaja se eie tyd. Die kind wat gebore sou word, word deel van ’n tydsaanduiding: voordat hy oud genoeg is om tussen goed en kwaad te onderskei, sou die politieke landskap reeds verander het. Dit is belangrik om hierdie oorspronklike konteks raak te sien, want dit keer dat ons die Ou Testament bloot as ’n versameling los voorspellings behandel.`,
        `Eeue later haal Matteus hierdie vers aan wanneer hy oor die geboorte van Jesus vertel. Die ou naam Immanuel kry binne Jesus se verhaal ’n veel groter omvang. God se teenwoordigheid word nou verbind met die Een wat tussen mense kom woon. Aan die einde van Matteus se Evangelie hoor ons dieselfde tema weer wanneer die opgestane Jesus vir sy dissipels verseker dat Hy by hulle sal wees tot die voleinding van die wêreld.`,
        `Dit is opvallend dat die naam Immanuel juis in ’n tyd van vrees verskyn. God se teenwoordigheid word aangekondig terwyl Agas nog bedreigings rondom hom sien. Die teken verander nie die wêreld onmiddellik in ’n probleemlose plek nie. Dit verklaar wie binne daardie wêreld teenwoordig is.`,
        `Ná die opstanding kry hierdie waarheid besondere diepte. Die dissipels sal binnekort gestuur word na ’n wêreld waarin hulle dikwels onseker en kwesbaar sal wees. Hulle gaan egter as mense wat die belofte van God se teenwoordigheid ken. Immanuel word daarom meer as ’n bekende Kersfeesnaam. Dit vertel iets oor die God wat sy mense binne hulle werklike geskiedenis ontmoet en by hulle bly.`
    ],
    questions: [
        `Waarom is die oorspronklike situasie van Agas belangrik vir jou begrip van die teken van Immanuel?`,
        `In watter situasie het jy vandag nodig om bewustelik te leef met die waarheid dat God by jou is?`
    ],
    prayer: `Here, dankie dat U u mense binne hulle vrees en onsekerheid ontmoet. Help my om u teenwoordigheid te vertrou en met die wete te leef dat ek nooit buite u sorg staan nie. Amen.`,
    available: true
  },
  {
    day: 22,
    title: `Lig in Galilea`,
    theme: `Die plek wat vernedering geken het, word die plek waar lig begin skyn`,
    reading: `Jesaja 9:1-7`,
    verse: `“Die volk wat in donkerte geleef het, het ’n groot lig gesien, oor dié wat in die donker land was, het ’n lig geskyn.”`,
    verseRef: `Jesaja 9:1 • 1983-vertaling`,
    paragraphs: [
        `Net voor ons Skrifgedeelte noem Jesaja die gebiede van Sebulon en Naftali. Dit was streke in die noorde van Israel wat besonder blootgestel was aan invalle vanuit die noorde. Wanneer Assiriese mag uitgebrei het, was hierdie gebiede van die eerstes wat die vernedering en ontwrigting daarvan ervaar het. Galilea se latere geskiedenis lê reeds in hierdie geografiese verwysing opgesluit.`,
        `Teen hierdie agtergrond word Jesaja se beeld van lig besonder treffend. Die lig begin skyn waar mense donkerte geken het. Die profeet beskryf verligting van onderdrukking en die einde van oorlog. Dan verskyn die kind aan wie heerskappy gegee word, die Seun wat met vrede en die troon van Dawid verbind word.`,
        `Die plek waar hierdie lig verskyn, word eeue later belangrik in die verhaal van Jesus. Matteus vertel dat Jesus Hom in Galilea vestig en verbind sy bediening uitdruklik met Jesaja se woorde. Jesus begin ’n groot deel van sy openbare bediening in dieselfde noordelike gebied waarvan die profeet gepraat het. Dorpe rondom die See van Galilea word die plek waar mense Hom hoor leer en sien hoe Hy siekes genees.`,
        `Geografie word so deel van die boodskap. Jerusalem sou waarskynlik vir baie mense die vanselfsprekende plek vir die belangrikste godsdienstige gebeure gewees het. Tog begin Jesus se verkondiging van die koninkryk grootliks tussen vissersdorpe en gewone gemeenskappe in Galilea. ’n Streek wat in Israel se geskiedenis dikwels aan die rand van groot gebeure gelê het, kom skielik in die lig.`,
        `Jesaja se lig is ook meer as ’n aangename gloed. Dit staan teenoor die juk wat mense gedra het en die geweld waarvan die soldateskoene getuig. Die vrede van God se beloofde Koning raak dus die werklike dinge wat mense se lewens onder druk plaas.`,
        `Die opstanding laat hierdie lig nog verder strek. Die boodskap wat in Galilea gehoor is, bly nie daar nie. Die opgestane Jesus stuur sy volgelinge uiteindelik na die nasies. Wat op ’n bepaalde plek begin skyn het, beweeg oor geografiese grense heen. God kan steeds juis op plekke wat onbelangrik of vergete lyk nuwe lig laat opgaan.`
    ],
    questions: [
        `Wat leer Jesus se bediening in Galilea jou oor die soort plekke waar God verkies om sy werk sigbaar te maak?`,
        `Waar het jy nodig dat Christus se lig nuwe perspektief bring in iets wat vir jou donker of moedeloos voel?`
    ],
    prayer: `Here Jesus, dankie dat u lig ook op onverwagte plekke skyn. Open my oë vir u werk waar ek dit maklik miskyk en laat u lig deur my lewe ook ander mense bereik. Amen.`,
    available: true
  },
  {
    day: 23,
    title: `’n Loot uit ’n afgekapte stomp`,
    theme: `God laat nuwe lewe groei waar die koninklike huis soos ’n afgekapte boom lyk`,
    reading: `Jesaja 11:1-10`,
    verse: `“’n Takkie sal uitspruit uit die stomp van Isai, ’n loot uit sy wortels sal vrugte dra.”`,
    verseRef: `Jesaja 11:1 • 1983-vertaling`,
    paragraphs: [
        `Die einde van Jesaja 10 is vol beelde van bome wat afgekap word. Hoog groeiende woude val onder God se oordeel. Wanneer hoofstuk 11 dan begin met ’n stomp waaruit ’n klein takkie uitspruit, is die kontras opvallend. Waar ’n mens maklik net die einde van ’n boom sou sien, sien Jesaja die begin van nuwe groei.`,
        `Die stomp word aan Isai verbind, die vader van Dawid. Daarmee neem Jesaja ons terug na die oorsprong van Israel se koningshuis. Dawid se dinastie sou groot word en later ernstig verval. Die beeld van die stomp erken hoe drasties hierdie verlies kan wees. Tog leef die wortels nog, en daaruit kom ’n nuwe loot.`,
        `Die toekomstige heerser word beskryf deur die Gees van die Here wat op hom rus. Sy regering word gekenmerk deur ’n vermoë om reg te oordeel en besondere aandag aan mense wat maklik onderdruk word. Daarna verbreed Jesaja die prentjie tot iets byna ondenkbaar: roofdier en prooi leef saam, en selfs klein kinders is veilig waar gevaar voorheen gewoon het.`,
        `Hierdie bekende beelde van die wolf en die skaap gaan daarom oor veel meer as ’n rustige natuurtoneel. Jesaja teken ’n wêreld waarin die vernietigende patrone wat ons as normaal begin aanvaar het, hulle mag verloor. Die koning uit Isai se geslag regeer op so ’n manier dat vrede tot in die geskape wêreld uitgebeeld kan word.`,
        `Vir die eerste Christene het Jesus as Seun van Dawid binne hierdie hoop gestaan. Sy opstanding sou die beeld van lewe uit iets wat dood gelyk het nog sterker laat spreek. Goeie Vrydag het soos die afkap van die boom gelyk. Opstandingsondag het getoon dat God se lewe op ’n plek kan verskyn waar mense reeds ’n einde gesien het.`,
        `Jesaja sluit hierdie gedeelte met ’n wêreldwye horison af. Die loot uit Isai word ’n teken waarna die nasies vra. Ons het hierdie beweging al vroeër in die belofte aan Abraham raakgesien, en hier kom dit binne die verwagting van ’n Dawidiese koning terug.`,
        `Die klein loot is daarom ’n kragtige geloofsbeeld. Ons hoef nie ’n situasie se huidige voorkoms met sy uiteindelike moontlikheid onder God te verwar nie. ’n Stomp kan steeds wortels hê, en God kan nuwe lewe laat uitspruit.`
    ],
    questions: [
        `Waarom is ’n klein loot uit ’n stomp so ’n gepaste beeld vir hoop ná verlies?`,
        `Is daar iets in jou lewe wat jy reeds as afgehandel beskou het waar jy God se nuwe werk steeds moet vertrou?`
    ],
    prayer: `Here, U kan nuwe lewe laat groei waar ek net verlies sien. Gee my geduld om u werk te vertrou en leer my om met hoop te kyk na dit wat nog klein en broos begin. Amen.`,
    available: true
  },
  {
    day: 24,
    title: `Die Dienaar wat die geknakte riet nie breek nie`,
    theme: `God se Dienaar bring sy reg met ’n verrassende sagtheid`,
    reading: `Jesaja 42:1-9`,
    verse: `“’n Geknakte riet sal hy nie afbreek nie, ’n lamppit wat dof brand, sal hy nie uitdoof nie.”`,
    verseRef: `Jesaja 42:3 • 1983-vertaling`,
    paragraphs: [
        `’n Riet wat reeds geknak het, het min waarde. Dit verg byna geen krag om dit heeltemal af te breek nie. ’n Lamppit wat skaars brand, kan met ’n klein beweging uitgedoof word. Jesaja gebruik juis hierdie twee brose beelde om iets van God se Dienaar te beskryf.`,
        `Die gedeelte begin met God wat sy Dienaar bekendstel as iemand op wie sy Gees rus. Hy het ’n taak wat met God se reg te doen het, en sy werk sal uiteindelik die nasies bereik. Tog word sy optrede op ’n verrassende manier beskryf. Hy skree nie om aandag in die strate nie, en wat reeds geknak of byna uitgedoof is, behandel hy met besondere sorg.`,
        `Sagtheid beteken hier geen gebrek aan doelgerigtheid nie. Die Dienaar sal aanhou totdat God se wil op aarde gevestig is. Jesaja plaas dus volharding en sagtheid binne dieselfde persoon. Hy hoef kwesbare mense nie te verpletter om sterk te wees nie.`,
        `Matteus haal hierdie gedeelte aan wanneer hy Jesus se bediening beskryf. Dit pas opvallend by die manier waarop Jesus met mense omgaan wat maklik afgeskryf kon word. Siekes, mense met ’n beskadigde reputasie en dié wat min aansien gehad het, ontdek telkens dat Hy hulle raaksien. Sy teenwoordigheid bring God se heerskappy naby sonder dat gebrokenheid Hom afstoot.`,
        `Daar is ook iets belangrik in die beeld van die dowwe lamppit. Die vlam is nog daar, al brand dit swak. Die Dienaar behandel dit as iets wat beskerm moet word. Dit is ’n ander manier om na mense se brose geloof, moed of hoop te kyk. Wat vir ’n buitestaander amper klaar lyk, kan steeds deur God gekoester word.`,
        `Ná die opstanding stuur Jesus sy dissipels om sy werk voort te sit. Die manier waarop Hy mense behandel het, word daarom ook belangrik vir die manier waarop sy volgelinge ander benader. ’n Kerk kan die waarheid verkondig en terselfdertyd leer om versigtig om te gaan met mense wat reeds geknak is.`,
        `Jesaja se Dienaar laat ons dus vra hoe God se krag lyk wanneer dit deur genade gevorm word. Soms is die heiligste reaksie op iets broos om dit nie verder te beskadig nie, en om ruimte te gee waarin die klein vlam weer sterker kan brand.`
    ],
    questions: [
        `Wat leer die geknakte riet en dowwe lamppit jou oor die manier waarop Jesus met brose mense omgaan?`,
        `Is daar iemand teenoor wie jy met meer geduld en sagtheid behoort op te tree?`
    ],
    prayer: `Here Jesus, dankie vir die sagtheid waarmee U mense in hulle gebrokenheid ontmoet. Vorm dieselfde genade in my en help my om ander met waarheid, geduld en sorg te behandel. Amen.`,
    available: true
  },
  {
    day: 25,
    title: `’n Lig vir die nasies`,
    theme: `God se reddingswerk het van die begin af ’n horison wat tot by die uithoeke van die aarde strek`,
    reading: `Jesaja 49:1-7`,
    verse: `“Ek maak jou ’n lig vir die nasies sodat die redding wat Ek bewerk, die uithoeke van die aarde sal bereik.”`,
    verseRef: `Jesaja 49:6 • 1983-vertaling`,
    paragraphs: [
        `Jesaja 49 begin met ’n oproep aan eilande en verre nasies om te luister. Nog voordat ons weet wat die Dienaar gaan sê, word die horison van die gedeelte wyd oopgetrek. Hierdie boodskap is bedoel om ver buite Israel gehoor te word.`,
        `Dan kom daar ’n interessante spanning in die teks. God noem die Dienaar “Israel”, maar enkele verse later kry hierdie Dienaar die taak om Jakob na God terug te bring en Israel te herstel. Die Dienaar verteenwoordig dus op een of ander manier die volk en het terselfdertyd ’n roeping teenoor die volk. Hierdie spanning het deur die eeue baie gesprek oor die identiteit van die Dienaar opgelewer.`,
        `Die belangrikste beweging in ons gedeelte kom in vers 6. Die herstel van Israel is volgens God se woorde te klein as die volle omvang van die Dienaar se taak. Die lig moet die nasies bereik, en God se redding moet tot by die uithoeke van die aarde kom. Ons hoor hier weer die wêreldwye lyn wat reeds by Abraham begin het.`,
        `Wanneer Jesus in die Nuwe Testament verskyn, word hierdie taal op verskillende maniere rondom Hom gehoor. Simeon praat byvoorbeeld oor lig vir die nasies wanneer hy die kind Jesus in die tempel sien. Later gebruik Paulus en Barnabas Jesaja 49 wanneer die evangelie verder na nie-Joodse mense versprei. Die Dienaar se sending en die sending van sy volgelinge begin dus binne dieselfde groot verhaal saamkom.`,
        `Dit is betekenisvol vir die veertig dae tussen Opstanding en Hemelvaart. Die dissipels moet geleidelik verstaan dat die opgestane Jesus se betekenis nie tot hulle eie kring of volk beperk kan word nie. Die boodskap oor Hom gaan oor grense beweeg wat hulle self waarskynlik nooit sou gekies het nie.`,
        `Die beeld van lig help ons om sending op ’n eenvoudige manier te verstaan. Lig bestaan om sigbaar te wees. Wanneer God mense by sy reddingswerk betrek, word hulle deel van iets wat na buite beweeg.`,
        `Jesaja 49 herinner ons daarom dat God se belangstelling altyd verder strek as ons eie bekende wêreld. Die evangelie het ons bereik omdat ander mense hierdie beweging ernstig opgeneem het. Nou leef ons self binne die verhaal van ’n lig wat steeds verder moet skyn.`
    ],
    questions: [
        `Wat tref jou aan die feit dat die Dienaar se taak doelbewus tot by die nasies uitgebrei word?`,
        `Wie is daar binne jou eie leefwêreld wat God moontlik deur jou getuienis en liefde wil bereik?`
    ],
    prayer: `Here Jesus, dankie dat u lig ook ons bereik het. Maak my gewillig om deel te wees van u werk in die wêreld en help my om u goeie nuus met liefde en getrouheid uit te leef. Amen.`,
    available: true
  },
  {
    day: 26,
    title: `Die Dienaar wat luister`,
    theme: `Die Dienaar se woorde groei uit ’n lewe wat elke dag na God luister`,
    reading: `Jesaja 50:4-9`,
    verse: `“Elke môre laat Hy my opnuut weer luister, Hy laat my luister soos ’n leerling moet luister.”`,
    verseRef: `Jesaja 50:4 • 1983-vertaling`,
    paragraphs: [
        `Jesaja 50 gee ons ’n besonder intieme blik op die Dienaar van die Here. Hy begin deur oor sy woorde te praat. God het hom geleer hoe om met vermoeide mense te praat en hulle moed te gee. Tog begin sy vermoë om te praat op ’n verrassende plek: hy moet eers leer luister.`,
        `Elke môre word sy oor opnuut vir God se onderrig oopgemaak. Die beeld is dié van ’n leerling wat voor sy leermeester sit. Die Dienaar tree dus nie bloot vanuit sy eie insig op nie. Sy woorde word gevorm deur aandagtige, herhaalde luister.`,
        `Dit gee aan die gedeelte ’n besondere ritme. Voordat daar sprake is van groot dade, hoor ons van gewone oggende. Gehoorsaamheid word oor tyd gevorm. Die Dienaar luister, leer en leef dan volgens wat hy gehoor het.`,
        `Vanaf vers 6 verander die atmosfeer. Die persoon wat na God luister, word geslaan, bespot en bespoeg. Sy gehoorsaamheid beskerm hom dus nie teen lyding nie. Tog draai hy nie terug nie. Sy volharding rus op die oortuiging dat God hom sal help en uiteindelik reg aan hom sal laat geskied.`,
        `Wanneer ons die Evangelies lees, herken ons iets van hierdie patroon in Jesus. Hy leef in voortdurende verhouding met die Vader, trek Hom gereeld terug om te bid en bly gehoorsaam wanneer die pad al moeiliker word. Die beskrywing van iemand wat geslaan en bespoeg word, sou vir die eerste Christene ook sterk herinneringe aan Jesus se lyding opgeroep het.`,
        `Daar is egter ’n eenvoudige waarheid in Jesaja 50 wat maklik verlore raak wanneer ons net op die lyding fokus. Die Dienaar wat ander mense met die regte woorde kan versterk, is self iemand wat luister.`,
        `Dit is ook ’n belangrike beginsel vir dissipelskap. Ons wil dikwels weet wat ons moet sê, hoe ons iemand moet help of watter besluit ons moet neem. Jesaja begin ’n tree vroeër. ’n Lewe wat God se stem wil weerspieël, moet ruimte maak om te luister.`,
        `Miskien is dit waarom die frase “elke môre” so waardevol is. Ons hoef nie vandag reeds alles te weet wat ons later nodig sal hê nie. Ons kan weer môre as leerlinge voor God kom sit.`
    ],
    questions: [
        `Wat leer die beeld van ’n leerling wat elke môre luister jou oor geestelike groei?`,
        `Waar in jou lewe het jy nodig om eers beter te luister voordat jy praat of optree?`
    ],
    prayer: `Here, leer my om soos ’n leerling na U te luister. Gee my woorde wat moedelose mense kan versterk en vorm in my die gehoorsaamheid om getrou te bly wanneer die pad moeilik word. Amen.`,
    available: true
  },
  {
    day: 27,
    title: `Die lydende Dienaar`,
    theme: `Jesaja 53 verander die manier waarop ons na lyding, skuld en verlossing kyk`,
    reading: `Jesaja 52:13-53:12`,
    verse: `“Oor óns oortredings is hy deurboor, oor óns sondes is hy verbrysel.”`,
    verseRef: `Jesaja 53:5 • 1983-vertaling`,
    paragraphs: [
        `Een van die opvallendste dinge in Jesaja 53 is die verandering in perspektief. Die mense wat praat, erken dat hulle die Dienaar verkeerd beoordeel het. Hulle het na sy lyding gekyk en gedink dat God hom straf. Later besef hulle dat sy lyding op ’n manier met húlle skuld verband hou.`,
        `Daardie besef kom telkens terug in die taal van die hoofstuk: “ons oortredings”, “ons sondes” en “ons almal”. Die leser word daarmee binne die verhaal ingetrek. Die Dienaar se lyding kan nie op ’n veilige afstand beskou word asof dit slegs oor iemand anders gaan nie.`,
        `Daar is terselfdertyd ’n vreemde mengsel van vernedering en uiteindelike verhoging. Die gedeelte begin reeds in Jesaja 52:13 met die verklaring dat die Dienaar voorspoedig sal wees en verhoog sal word. Daarna volg die beskrywing van verwerping, lyding en dood. Teen die einde hoor ons weer van lig, nageslag en oorwinning. Die pad van die Dienaar loop dus deur ’n plek wat soos totale mislukking lyk.`,
        `Dit is maklik om te verstaan waarom hierdie hoofstuk so belangrik geword het vir die eerste Christene. In Handelinge 8 sit ’n Etiopiese amptenaar juis hierdie gedeelte en lees. Hy verstaan nie oor wie die profeet praat nie. Filippus begin by hierdie Skrifgedeelte en vertel hom die goeie nuus oor Jesus.`,
        `Die kruis het Jesus se dissipels aanvanklik verbyster. Jesaja 53 gee taal waarmee hulle later kon verstaan hoe lyding binne God se verlossingswerk kon staan. Die onskuldige Dienaar dra wat aan ander behoort en sy vernedering loop uiteindelik uit op God se bevestiging van hom.`,
        `Ons moet egter versigtig wees dat bekendheid nie die krag van die gedeelte verdof nie. Jesaja beskryf ’n wêreld waarin mense hulle eie skuld begin raaksien terwyl hulle na die lydende Dienaar kyk. Die teks vra dus meer as dat ons ’n voorspelling korrek identifiseer. Dit bring ons voor die vraag wat sy wonde met óns te doen het.`,
        `Ná die opstanding kon die dissipels terugkyk na die kruis met nuwe oë. Die Een wat hulle verloor het, het geleef. Wat op Goeie Vrydag soos nederlaag gelyk het, het binne God se reddingsverhaal ’n betekenis gekry wat hulle vroeër nie kon begryp nie.`
    ],
    questions: [
